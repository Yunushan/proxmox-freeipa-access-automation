---
- name: Prepare Linux inventory for the FreeIPA workflow
  import_playbook: includes/prepare_linux_inventory.yml
  tags:
    - freeipa
    - freeipa_access
    - inventory
    - discovery

- name: Ensure QEMU Guest Agent on reachable guests for the FreeIPA workflow
  import_playbook: includes/ensure_guest_qemu_agent.yml
  tags:
    - freeipa
    - freeipa_access
    - linux
    - windows
    - inventory
    - qga_install

- name: Bootstrap Linux SSH access through the Proxmox guest agent for the FreeIPA workflow
  import_playbook: includes/bootstrap_linux_qga_ssh.yml
  tags:
    - freeipa
    - freeipa_access
    - linux
    - inventory
    - discovery
    - qga_bootstrap

- name: Bootstrap Linux SSH access for the FreeIPA workflow
  import_playbook: includes/bootstrap_linux_ssh.yml
  tags:
    - freeipa
    - freeipa_access
    - linux
    - inventory
    - ssh_bootstrap

- name: Ensure QEMU Guest Agent on Linux guests that became reachable after bootstrap for the FreeIPA workflow
  import_playbook: includes/ensure_linux_guest_qemu_agent.yml
  tags:
    - freeipa
    - freeipa_access
    - linux
    - inventory
    - qga_install

- name: Build FreeIPA access model only
  hosts: ipa_servers
  become: true
  gather_facts: false
  serial: "{{ freeipa_access_serial | default(1) | int }}"
  max_fail_percentage: "{{ freeipa_access_max_fail_percentage | default(0) | int }}"
  tags:
    - freeipa
    - freeipa_access
  roles:
    - role: freeipa_access_model
      when: freeipa_access_model_enabled | bool
      tags:
        - freeipa
        - freeipa_access

- name: Refresh Linux SSSD caches after FreeIPA access-model changes
  hosts: linux_ipa_clients_runtime
  become: true
  gather_facts: false
  serial: "{{ linux_freeipa_enroll_serial | default(10) | int }}"
  max_fail_percentage: "{{ linux_freeipa_enroll_max_fail_percentage | default(0) | int }}"
  tags:
    - freeipa
    - freeipa_access
    - linux
    - linux_refresh
  roles:
    - role: linux_sssd_refresh
      when:
        - freeipa_access_model_enabled | bool
        - linux_sssd_refresh_enabled | bool
      tags:
        - freeipa
        - freeipa_access
        - linux
        - linux_refresh
