---
- name: Prepare Linux inventory for the combined site workflow
  import_playbook: includes/prepare_linux_inventory.yml
  tags:
    - freeipa
    - freeipa_access
    - linux
    - linux_enroll
    - inventory
    - discovery

- name: Cache Linux split DNS runtime defaults for the combined site workflow
  import_playbook: includes/cache_linux_split_dns_runtime_defaults.yml
  tags:
    - linux
    - linux_enroll
    - inventory
    - discovery

- name: Enable Proxmox VM guest-agent communication for Linux guests in the combined site workflow
  import_playbook: includes/enable_proxmox_vm_qga.yml
  tags:
    - linux
    - inventory
    - qga_install

- name: Ensure QEMU Guest Agent on reachable guests for the combined site workflow
  import_playbook: includes/ensure_guest_qemu_agent.yml
  tags:
    - linux
    - windows
    - inventory
    - qga_install

- name: Bootstrap Linux SSH access through the Proxmox guest agent for the combined site workflow
  import_playbook: includes/bootstrap_linux_qga_ssh.yml
  tags:
    - linux
    - inventory
    - discovery
    - qga_bootstrap

- name: Bootstrap Linux SSH access for the combined site workflow
  import_playbook: includes/bootstrap_linux_ssh.yml
  tags:
    - linux
    - inventory
    - ssh_bootstrap

- name: Ensure QEMU Guest Agent on Linux guests that became reachable after bootstrap for the combined site workflow
  import_playbook: includes/ensure_linux_guest_qemu_agent.yml
  tags:
    - linux
    - inventory
    - qga_install

- name: Resolve Linux hostnames for the combined site workflow
  import_playbook: includes/resolve_linux_hostnames.yml
  tags:
    - freeipa
    - freeipa_access
    - linux
    - linux_enroll
    - inventory
    - hostnames

- name: Build FreeIPA access model
  hosts: ipa_servers
  become: true
  gather_facts: false
  serial: "{{ freeipa_access_serial | default(1) | int }}"
  max_fail_percentage: "{{ freeipa_access_max_fail_percentage | default(0) | int }}"
  tags:
    - freeipa
    - freeipa_access
  roles:
    - role: freeipa_access_model
      vars:
        freeipa_access_model_manage_inventory_group_host_membership: false
      when: freeipa_access_model_enabled | bool
      tags:
        - freeipa
        - freeipa_access

- name: Configure Proxmox LDAP realm and RBAC
  hosts: proxmox_primary
  become: true
  gather_facts: false
  serial: "{{ proxmox_rollout_serial | default(1) | int }}"
  max_fail_percentage: "{{ proxmox_rollout_max_fail_percentage | default(0) | int }}"
  tags:
    - proxmox
  roles:
    - role: proxmox_ldap_realm
      when: proxmox_ldap_enabled | bool
      tags:
        - proxmox
        - proxmox_ldap
    - role: proxmox_realm_sync_timer
      when: proxmox_ldap_enabled | bool and proxmox_realm_sync_timer_enabled | bool
      tags:
        - proxmox
        - proxmox_sync
    - role: proxmox_rbac
      when: proxmox_ldap_enabled | bool and proxmox_rbac_enabled | bool
      tags:
        - proxmox
        - proxmox_rbac

- name: Enroll Linux guests into FreeIPA
  hosts: linux_ipa_clients_runtime
  become: true
  gather_facts: true
  vars:
    linux_freeipa_enroll_runtime_split_dns_group_vars_file: >-
      {{
        (
          inventory_dir
          if (inventory_dir | default('', true) | string | trim | length) > 0
          else (playbook_dir ~ '/../inventories/production')
        )
        ~ '/group_vars/all/30-linux-clients.yml'
      }}
    linux_freeipa_enroll_runtime_split_dns_group_vars: >-
      {{
        (
          lookup(
            'ansible.builtin.file',
            linux_freeipa_enroll_runtime_split_dns_group_vars_file,
            errors='ignore'
          )
          | default('{}', true)
          | from_yaml
        )
        | default({}, true)
      }}
    linux_freeipa_enroll_runtime_split_dns_public_dns_mode: >-
      {{
        linux_freeipa_enroll_runtime_split_dns_group_vars.linux_freeipa_enroll_split_dns_public_dns_mode
        | default(
            hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_mode,
            true
          )
        | default(linux_freeipa_enroll_split_dns_public_dns_mode, true)
        | default('explicit', true)
      }}
    linux_freeipa_enroll_runtime_split_dns_public_dns_servers: >-
      {{
        linux_freeipa_enroll_runtime_split_dns_group_vars.linux_freeipa_enroll_split_dns_public_dns_servers
        | default(
            hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_servers,
            true
          )
        | default(linux_freeipa_enroll_split_dns_public_dns_servers, true)
        | default([], true)
      }}
  serial: "{{ linux_freeipa_enroll_serial | default(10) | int }}"
  max_fail_percentage: "{{ linux_freeipa_enroll_max_fail_percentage | default(0) | int }}"
  tags:
    - linux
    - linux_enroll
  roles:
    - role: linux_freeipa_enroll
      when: linux_freeipa_enroll_enabled | bool
      tags:
        - linux
        - linux_enroll

- name: Ensure QEMU Guest Agent on Linux guests after enrollment for the combined site workflow
  import_playbook: includes/ensure_linux_guest_qemu_agent.yml
  tags:
    - linux
    - inventory
    - qga_install

- name: Add Linux guests to runtime-backed FreeIPA hostgroups
  hosts: ipa_servers
  become: true
  gather_facts: false
  serial: "{{ freeipa_access_serial | default(1) | int }}"
  max_fail_percentage: "{{ freeipa_access_max_fail_percentage | default(0) | int }}"
  tags:
    - freeipa
    - freeipa_access
    - linux
    - linux_enroll
  roles:
    - role: freeipa_runtime_hostgroup_membership
      vars:
        freeipa_runtime_hostgroup_membership_inventory_group: "{{ linux_freeipa_enroll_success_group | default('linux_ipa_clients_enrolled_runtime') }}"
        freeipa_runtime_hostgroup_membership_hostgroup_inventory_groups:
          - "{{ linux_ipa_runtime_group | default('linux_ipa_clients_runtime') }}"
      when:
        - freeipa_access_model_enabled | bool
        - freeipa_runtime_hostgroup_membership_enabled | bool
      tags:
        - freeipa
        - freeipa_access
        - linux
        - linux_enroll

- name: Seed Proxmox VM event onboarding target runtime group
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - proxmox
    - proxmox_event
  tasks:
    - name: Add participating Proxmox nodes to the VM event onboarding runtime group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: proxmox_vm_event_onboarding_targets
      loop: "{{ linux_ipa_proxmox_discovery_nodes | default([]) }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
      when:
        - proxmox_vm_event_onboarding_enabled | bool
        - linux_ipa_proxmox_discovery_enabled | bool

- name: Deploy controller-side Proxmox VM event onboarding
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tags:
    - proxmox
    - proxmox_event
  roles:
    - role: proxmox_vm_event_onboarding
      when: proxmox_vm_event_onboarding_enabled | bool
      tags:
        - proxmox
        - proxmox_event

- name: Deploy Proxmox-side VM event onboarding
  hosts: proxmox_vm_event_onboarding_targets
  become: true
  gather_facts: false
  serial: "{{ proxmox_rollout_serial | default(1) | int }}"
  max_fail_percentage: "{{ proxmox_rollout_max_fail_percentage | default(0) | int }}"
  tags:
    - proxmox
    - proxmox_event
  roles:
    - role: proxmox_vm_event_onboarding
      when: proxmox_vm_event_onboarding_enabled | bool
      tags:
        - proxmox
        - proxmox_event

- name: Refresh Linux SSSD caches after FreeIPA access-model changes
  hosts: linux_ipa_clients_runtime
  become: true
  gather_facts: false
  serial: "{{ linux_freeipa_enroll_serial | default(10) | int }}"
  max_fail_percentage: "{{ linux_freeipa_enroll_max_fail_percentage | default(0) | int }}"
  tags:
    - freeipa
    - freeipa_access
    - linux
    - linux_refresh
  roles:
    - role: linux_sssd_refresh
      when:
        - freeipa_access_model_enabled | bool
        - linux_sssd_refresh_enabled | bool
      tags:
        - freeipa
        - freeipa_access
        - linux
        - linux_refresh
