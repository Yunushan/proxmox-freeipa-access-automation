---
- name: Prepare Linux inventory for the Linux client workflow
  import_playbook: includes/prepare_linux_inventory.yml
  tags:
    - linux
    - linux_enroll
    - inventory
    - discovery

- name: Cache Linux split DNS runtime defaults for the Linux client workflow
  import_playbook: includes/cache_linux_split_dns_runtime_defaults.yml
  tags:
    - linux
    - linux_enroll
    - inventory
    - discovery

- name: Ensure QEMU Guest Agent on reachable guests for the Linux client workflow
  import_playbook: includes/ensure_guest_qemu_agent.yml
  tags:
    - linux
    - windows
    - inventory
    - qga_install

- name: Bootstrap Linux SSH access through the Proxmox guest agent for the Linux client workflow
  import_playbook: includes/bootstrap_linux_qga_ssh.yml
  tags:
    - linux
    - inventory
    - discovery
    - qga_bootstrap

- name: Bootstrap Linux SSH access for the Linux client workflow
  import_playbook: includes/bootstrap_linux_ssh.yml
  tags:
    - linux
    - inventory
    - ssh_bootstrap

- name: Resolve Linux hostnames for the Linux client workflow
  import_playbook: includes/resolve_linux_hostnames.yml
  tags:
    - linux
    - linux_enroll
    - inventory
    - hostnames

- name: Enroll Linux guests into FreeIPA only
  hosts: linux_ipa_clients_runtime
  become: true
  gather_facts: true
  vars:
    linux_freeipa_enroll_runtime_split_dns_public_dns_mode: >-
      {{
        hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_mode
        | default(linux_freeipa_enroll_split_dns_public_dns_mode, true)
        | default('explicit', true)
      }}
    linux_freeipa_enroll_runtime_split_dns_public_dns_servers: >-
      {{
        hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_servers
        | default(linux_freeipa_enroll_split_dns_public_dns_servers, true)
        | default([], true)
      }}
  serial: "{{ linux_freeipa_enroll_serial | default(10) | int }}"
  max_fail_percentage: "{{ linux_freeipa_enroll_max_fail_percentage | default(0) | int }}"
  tags:
    - linux
    - linux_enroll
  roles:
    - role: linux_freeipa_enroll
      when: linux_freeipa_enroll_enabled | bool
      tags:
        - linux
        - linux_enroll
