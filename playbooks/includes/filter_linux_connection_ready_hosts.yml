---
- name: Filter Linux guests with a working management connection
  hosts: linux_ipa_clients_runtime
  gather_facts: false
  ignore_unreachable: true
  serial: "{{ linux_freeipa_enroll_serial | default(10) | int }}"
  max_fail_percentage: "{{ linux_freeipa_enroll_max_fail_percentage | default(0) | int }}"
  tags:
    - linux
    - inventory
    - qga_install
    - hostnames
    - linux_enroll
  tasks:
    - name: Check whether sshpass is available for password-based Linux connection probes
      ansible.builtin.command:
        argv:
          - which
          - sshpass
      register: linux_ipa_connection_ready_sshpass_check
      changed_when: false
      failed_when: false
      delegate_to: localhost
      when: hostvars[inventory_hostname].ansible_password | default('', true) | string | trim | length > 0

    - name: Probe the Linux guest management connection from the controller
      vars:
        linux_ipa_connection_ready_effective_user: "{{ hostvars[inventory_hostname].ansible_user | default('root') }}"
        linux_ipa_connection_ready_effective_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
        linux_ipa_connection_ready_effective_port: "{{ hostvars[inventory_hostname].ansible_port | default(22) }}"
        linux_ipa_connection_ready_effective_key_file: "{{ hostvars[inventory_hostname].ansible_ssh_private_key_file | default('', true) | string | trim }}"
        linux_ipa_connection_ready_effective_common_args: "{{ hostvars[inventory_hostname].ansible_ssh_common_args | default('', true) | string | trim }}"
        linux_ipa_connection_ready_has_password: "{{ hostvars[inventory_hostname].ansible_password | default('', true) | string | trim | length > 0 }}"
        linux_ipa_connection_ready_probe_command: >-
          {{
            (
              'sshpass -e '
              if (linux_ipa_connection_ready_has_password | bool)
              else ''
            )
            ~ 'ssh -o ConnectTimeout=5 -o NumberOfPasswordPrompts=1 '
            ~ (
              ''
              if (linux_ipa_connection_ready_has_password | bool)
              else '-o BatchMode=yes '
            )
            ~ (
              linux_ipa_connection_ready_effective_common_args ~ ' '
              if (linux_ipa_connection_ready_effective_common_args | length > 0)
              else ''
            )
            ~ (
              '-i ' ~ (linux_ipa_connection_ready_effective_key_file | quote) ~ ' '
              if (linux_ipa_connection_ready_effective_key_file | length > 0)
              else ''
            )
            ~ '-p ' ~ (linux_ipa_connection_ready_effective_port | string | quote) ~ ' '
            ~ ((linux_ipa_connection_ready_effective_user ~ '@' ~ linux_ipa_connection_ready_effective_host) | quote)
            ~ ' true'
          }}
      ansible.builtin.shell: "{{ linux_ipa_connection_ready_probe_command }}"
      args:
        executable: /bin/sh
      environment:
        SSHPASS: "{{ hostvars[inventory_hostname].ansible_password | default('', true) | string }}"
      register: linux_ipa_connection_ready_probe_result
      changed_when: false
      failed_when: false
      delegate_to: localhost
      when:
        - not (
            (hostvars[inventory_hostname].ansible_password | default('', true) | string | trim | length > 0)
            and (linux_ipa_connection_ready_sshpass_check.rc | default(1) | int != 0)
          )

    - name: Summarize whether the Linux guest management connection is ready
      vars:
        linux_ipa_connection_ready_has_password: "{{ hostvars[inventory_hostname].ansible_password | default('', true) | string | trim | length > 0 }}"
      ansible.builtin.set_fact:
        linux_ipa_connection_ready_check:
          failed: >-
            {{
              (
                (linux_ipa_connection_ready_has_password | bool)
                and (linux_ipa_connection_ready_sshpass_check.rc | default(1) | int != 0)
              )
              or
              (
                linux_ipa_connection_ready_probe_result.rc
                | default(1)
                | int
              ) != 0
            }}
          unreachable: false
          msg: >-
            {{
              (
                'sshpass is required on the controller for password-based Linux connection probes'
                if (
                  (linux_ipa_connection_ready_has_password | bool)
                  and (linux_ipa_connection_ready_sshpass_check.rc | default(1) | int != 0)
                )
                else (
                  (
                    linux_ipa_connection_ready_probe_result.stderr
                    | default(linux_ipa_connection_ready_probe_result.stdout, true)
                    | default('connection probe succeeded', true)
                  )
                  | string
                  | trim
                )
              )
            }}
      changed_when: false

    - name: Explain which management path was selected for a Linux guest
      vars:
        linux_ipa_connection_ready_bootstrap_status: "{{ hostvars[inventory_hostname].linux_ipa_management_path_bootstrap_status | default('', true) | string | trim }}"
        linux_ipa_connection_ready_bootstrap_detail: "{{ hostvars[inventory_hostname].linux_ipa_management_path_bootstrap_detail | default('', true) | string | trim }}"
      ansible.builtin.debug:
        msg: >-
          Linux guest {{ inventory_hostname }} is ready for connection-dependent automation via
          {{
            (
              'QGA bootstrap'
              if (linux_ipa_connection_ready_bootstrap_status == 'qga-bootstrap-ok')
              else 'direct SSH'
            )
          }}
          as {{
            hostvars[inventory_hostname].ansible_user | default('root')
          }}@{{
            hostvars[inventory_hostname].ansible_host | default(inventory_hostname)
          }}.{{
            (
              ' ' ~ linux_ipa_connection_ready_bootstrap_detail
              if (linux_ipa_connection_ready_bootstrap_detail | length > 0)
              else ''
            )
          }}
      changed_when: false
      when:
        - linux_ipa_connection_ready_check is defined
        - not (linux_ipa_connection_ready_check.unreachable | default(false))
        - not (linux_ipa_connection_ready_check.failed | default(false))

    - name: Add Linux guest to the manageable runtime group when the connection works
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: linux_ipa_clients_manageable_runtime
      delegate_to: localhost
      changed_when: false
      when:
        - linux_ipa_connection_ready_check is defined
        - not (linux_ipa_connection_ready_check.unreachable | default(false))
        - not (linux_ipa_connection_ready_check.failed | default(false))

    - name: Track Linux guests skipped because the management connection is unavailable
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: linux_ipa_clients_connection_unavailable_runtime
      delegate_to: localhost
      changed_when: false
      when:
        - linux_ipa_connection_ready_check is not defined
          or (linux_ipa_connection_ready_check.unreachable | default(false))
          or (linux_ipa_connection_ready_check.failed | default(false))

    - name: Explain why the Linux guest is skipped for connection-dependent tasks
      vars:
        linux_ipa_connection_ready_bootstrap_status: "{{ hostvars[inventory_hostname].linux_ipa_management_path_bootstrap_status | default('', true) | string | trim }}"
        linux_ipa_connection_ready_bootstrap_detail: "{{ hostvars[inventory_hostname].linux_ipa_management_path_bootstrap_detail | default('', true) | string | trim }}"
      ansible.builtin.debug:
        msg: >-
          Skipping connection-dependent Linux automation for {{ inventory_hostname }}
          because the configured management connection is not usable yet.
          Current target: {{
            (hostvars[inventory_hostname].ansible_user | default('root'))
          }}@{{
            hostvars[inventory_hostname].ansible_host | default(inventory_hostname)
          }}.
          Detail: {{
            linux_ipa_connection_ready_check.msg
            | default('connection setup did not succeed')
            | string
            | trim
          }}.{{
            (
              ' Bootstrap path status: ' ~ linux_ipa_connection_ready_bootstrap_status ~ '.'
              if (linux_ipa_connection_ready_bootstrap_status | length > 0)
              else ''
            )
          }}{{
            (
              ' Bootstrap detail: ' ~ linux_ipa_connection_ready_bootstrap_detail ~ '.'
              if (linux_ipa_connection_ready_bootstrap_detail | length > 0)
              else ''
            )
          }}{{
            (
              ' For Proxmox-discovered guests, set linux_ipa_proxmox_discovery_ansible_user and either linux_ipa_proxmox_discovery_ansible_password or linux_ipa_proxmox_discovery_ansible_ssh_private_key_file so the repository has a real first-touch SSH path.'
              if (hostvars[inventory_hostname].linux_ipa_source | default('') == 'proxmox_discovery')
              else ''
            )
          }}
      changed_when: false
      when:
        - linux_ipa_connection_ready_check is not defined
          or (linux_ipa_connection_ready_check.unreachable | default(false))
          or (linux_ipa_connection_ready_check.failed | default(false))
