---
- name: Prepare Linux inventory for a Proxmox VM event
  import_playbook: includes/prepare_linux_event_inventory.yml
  tags:
    - linux
    - inventory
    - discovery
    - event

- name: Ensure QEMU Guest Agent on reachable guests for a Proxmox VM event
  import_playbook: includes/ensure_guest_qemu_agent.yml
  tags:
    - linux
    - windows
    - inventory
    - qga_install
    - event

- name: Bootstrap Linux SSH access through the Proxmox guest agent for a Proxmox VM event
  import_playbook: includes/bootstrap_linux_qga_ssh.yml
  tags:
    - linux
    - inventory
    - discovery
    - qga_bootstrap
    - event

- name: Bootstrap Linux SSH access for a Proxmox VM event
  import_playbook: includes/bootstrap_linux_ssh.yml
  tags:
    - linux
    - inventory
    - ssh_bootstrap
    - event

- name: Resolve Linux hostnames for a Proxmox VM event
  import_playbook: includes/resolve_linux_hostnames.yml
  tags:
    - linux
    - inventory
    - hostnames
    - event

- name: Enroll event-target Linux guests into FreeIPA
  hosts: linux_ipa_clients_runtime
  become: true
  gather_facts: true
  serial: "{{ linux_freeipa_enroll_serial | default(10) | int }}"
  max_fail_percentage: "{{ linux_freeipa_enroll_max_fail_percentage | default(0) | int }}"
  tags:
    - linux
    - linux_enroll
    - event
  roles:
    - role: linux_freeipa_enroll
      when: linux_freeipa_enroll_enabled | bool
      tags:
        - linux
        - linux_enroll
        - event

- name: Add event-target Linux guests to runtime-backed FreeIPA hostgroups
  hosts: ipa_servers
  become: true
  gather_facts: false
  serial: "{{ freeipa_access_serial | default(1) | int }}"
  max_fail_percentage: "{{ freeipa_access_max_fail_percentage | default(0) | int }}"
  tags:
    - freeipa
    - freeipa_access
    - event
  roles:
    - role: freeipa_runtime_hostgroup_membership
      when:
        - freeipa_access_model_enabled | bool
        - freeipa_runtime_hostgroup_membership_enabled | bool
      tags:
        - freeipa
        - freeipa_access
        - event

- name: Refresh SSSD on event-target Linux guests after FreeIPA updates
  hosts: linux_ipa_clients_runtime
  become: true
  gather_facts: false
  serial: "{{ linux_freeipa_enroll_serial | default(10) | int }}"
  max_fail_percentage: "{{ linux_freeipa_enroll_max_fail_percentage | default(0) | int }}"
  tags:
    - linux
    - linux_refresh
    - event
  roles:
    - role: linux_sssd_refresh
      when:
        - linux_freeipa_enroll_enabled | bool
        - linux_sssd_refresh_enabled | bool
      tags:
        - linux
        - linux_refresh
        - event
