---
# -----------------------------
# Windows guest management
# -----------------------------
# Enable the separate workflow with windows_domain_membership_enabled in
# 10-features.yml, then place target hosts in windows_management_clients.
windows_domain_membership_state: domain

# Join Windows to Active Directory directly. In FreeIPA-centered environments,
# this usually means joining the AD side of a FreeIPA-AD trust.
windows_domain_membership_dns_domain_name: ""
windows_domain_membership_domain_admin_user: ""
windows_domain_membership_domain_admin_password: "{{ vault_windows_domain_admin_password | default('') }}"
windows_domain_membership_domain_ou_path: ""
windows_domain_membership_domain_server: ""

# Optional: set a specific Windows hostname during the membership change.
windows_domain_membership_hostname: ""

# Used only when windows_domain_membership_state is workgroup.
windows_domain_membership_workgroup_name: WORKGROUP

# Reboot automatically when the membership change requires it.
windows_domain_membership_reboot: true
windows_domain_membership_reboot_timeout: 900

# -----------------------------
# Limited FreeIPA-aware Windows helpers
# -----------------------------
# This is not Windows domain join. It only provides helper tasks such as IPA
# CA trust import, optional hosts-file bootstrap, and IPA reachability checks.
# Run playbooks/windows-freeipa-validate.yml when you want validation-only
# coverage without changing CA trust, hosts entries, local groups, or OpenSSH.
windows_freeipa_helpers_emit_summary: true
windows_freeipa_helpers_ipa_servers: "{{ linux_ipa_servers | default([]) }}"
windows_freeipa_helpers_https_port: "{{ linux_freeipa_enroll_https_port | default(443) }}"

windows_freeipa_helpers_trust_ipa_ca: false
windows_freeipa_helpers_ipa_ca_auto_fetch: false
windows_freeipa_helpers_ipa_ca_auto_fetch_server: ""
windows_freeipa_helpers_ipa_ca_expected_thumbprint: ""
windows_freeipa_helpers_ipa_ca_certificate_src: ""
windows_freeipa_helpers_ipa_ca_certificate_content: ""
windows_freeipa_helpers_ipa_ca_store_location: LocalMachine
windows_freeipa_helpers_ipa_ca_store_name: Root

windows_freeipa_helpers_manage_hosts_entries: false
windows_freeipa_helpers_hosts_entries: []
windows_freeipa_helpers_manage_local_group_memberships: false
windows_freeipa_helpers_local_group_memberships: []

windows_freeipa_helpers_manage_openssh_server: false
windows_freeipa_helpers_openssh_install: true
windows_freeipa_helpers_openssh_port: 22

windows_freeipa_helpers_validate_dns: true
windows_freeipa_helpers_validate_tcp: true
windows_freeipa_helpers_tcp_ports:
  - 88
  - 389
  - 443
windows_freeipa_helpers_tcp_timeout_ms: 3000
windows_freeipa_helpers_validate_https: true
windows_freeipa_helpers_https_timeout_ms: 15000
windows_freeipa_helpers_validate_time_source: false
windows_freeipa_helpers_time_source: ""
