---
# -----------------------------
# FreeIPA admin/API values
# -----------------------------
freeipa_admin_principal: admin
freeipa_admin_password: "{{ vault_freeipa_admin_password }}"
freeipa_api_context: server

# -----------------------------
# FreeIPA access model
# -----------------------------
# Add IPA usernames here to grant Linux SSH + sudo through the
# declarative linux-ssh-admins group, HBAC rule, and sudo rule.
# Leave this empty if linux-ssh-admins membership is managed directly in FreeIPA.
freeipa_linux_admin_users: []

freeipa_user_groups:
  - name: proxmox-admins
    description: Full Proxmox administrators
  - name: linux-ssh-admins
    description: Linux administrators with SSH access and sudo rights
    user: "{{ freeipa_linux_admin_users }}"

# New IPA users inherit this shell, and existing direct members of the
# groups below are corrected to the same shell during freeipa/site runs.
freeipa_default_login_shell: /bin/bash
freeipa_login_shell_groups:
  - linux-ssh-admins

freeipa_hostgroups:
  - name: linux-all
    description: All Linux clients from the prepared runtime group
    inventory_groups:
      - linux_ipa_clients_runtime

freeipa_hbac_rules:
  - name: allow-linux-ssh-admins
    description: Allow linux-ssh-admins to access all Linux IPA clients over SSH
    group:
      - linux-ssh-admins
    hostgroup:
      - linux-all
    hbacsvc:
      - sshd
    state: enabled

freeipa_sudo_rules:
  - name: allow-linux-ssh-admins-sudo
    description: Allow linux-ssh-admins to run any command via sudo on all Linux IPA clients
    group:
      - linux-ssh-admins
    hostgroup:
      - linux-all
    cmdcategory: all
    runasusercategory: all
    runasgroupcategory: all
    state: enabled
