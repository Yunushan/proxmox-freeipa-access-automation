---
# -----------------------------
# Linux IPA client enrollment
# -----------------------------
ipaclient_domain: example.com
ipaclient_realm: EXAMPLE.COM
linux_ipa_servers:
  - ipa01.example.com
linux_ipaclient_mkhomedir: true
linux_ipaclient_force_join: false
linux_ipaclient_no_dns_lookup: true
linux_ipaclient_no_sudo: false
linux_ipasssd_permit: false
linux_sssd_refresh_enabled: true
# Install QEMU Guest Agent automatically on guests that are already reachable.
guest_qemu_agent_install_enabled: true
linux_ipa_ssh_host_key_policy: accept_new
# Prefer no-reboot SSH bootstrap through the Proxmox guest agent for
# Proxmox-discovered Linux VMs before any SSH-dependent hostname or enrollment
# tasks run.
linux_ipa_qga_ssh_bootstrap_enabled: true
linux_ipa_qga_ssh_bootstrap_user: ansible-bootstrap
linux_ipa_ssh_bootstrap_enabled: false
linux_ipa_ssh_bootstrap_password: "{{ vault_linux_ipa_ssh_bootstrap_password | default('') }}"
linux_ipa_identity_hostname_suffix: ""
linux_freeipa_enroll_manage_hostname: false
linux_freeipa_enroll_continue_on_join_timeout: true
linux_freeipa_enroll_manage_authoritative_dns: true
linux_freeipa_enroll_authoritative_dns_delegate_host: ""
linux_freeipa_enroll_authoritative_dns_query_server: 127.0.0.1
linux_freeipa_enroll_authoritative_dns_remove_link_local_aaaa: true
linux_freeipa_enroll_pin_local_hostname_in_etc_hosts: true
linux_freeipa_enroll_split_dns_public_dns_mode: explicit
linux_freeipa_enroll_split_dns_public_dns_servers:
  - 1.1.1.1
  - 1.0.0.1
linux_ipaclient_configure_dns_resolver: false
linux_ipaclient_dns_servers: []
linux_ipaclient_install_packages: true
linux_ipa_manage_etc_hosts: false
linux_ipa_etc_hosts_entries: []
linux_ipa_client_hosts: []
# Example hostname-based entries:
# linux_ipa_client_hosts:
#   - name: rocky-app-01.example.com
#   - name: ubuntu-jump-01.example.com
#
# Example short hostnames completed with a shared suffix:
# linux_ipa_identity_hostname_suffix: example.net
# linux_freeipa_enroll_manage_hostname: true
# linux_freeipa_enroll_manage_authoritative_dns: false
# Set linux_freeipa_enroll_authoritative_dns_delegate_host when the first
# host in ipa_servers is not the right FreeIPA DNS server to repair records on.
# linux_freeipa_enroll_pin_local_hostname_in_etc_hosts: true
#
# Linux guest SSH host key policy:
# strict: require a pre-populated known_hosts entry
# accept_new: trust first-seen host keys but still fail on changed keys
# disabled: disable host key checking for Linux guest connections
#
# Optional guest-agent installation fallback:
# guest_qemu_agent_install_enabled installs qemu-guest-agent on Linux guests
# that are already reachable over SSH, and installs QEMU Guest Agent on hosts
# in the optional windows_qemu_guest_agent_clients inventory group when they
# are already reachable over WinRM or Windows SSH.
#
# Optional Linux guest SSH key bootstrap:
# linux_ipa_qga_ssh_bootstrap_enabled: use Proxmox QEMU Guest Agent to create
# a dedicated key-only automation user inside already running guests without a
# reboot. This is the preferred path for Proxmox-discovered VMs when QGA works.
# linux_ipa_qga_ssh_bootstrap_user controls the in-guest automation username.
#
# enable linux_ipa_ssh_bootstrap_enabled to install the controller public key
# onto the SSH user used for Linux guest connections before hostname resolution
# and enrollment. Keep linux_ipa_ssh_bootstrap_password in vaulted group_vars or
# host vars when guests need a shared first-touch password.
#
# Example /etc/hosts bootstrap entries when IPA DNS is not ready yet:
# linux_ipa_manage_etc_hosts: true
# linux_ipa_etc_hosts_entries:
#   - ip: 192.0.2.101
#     names:
#       - app-server-01.example.com
#       - app-server-01
#   - ip: 192.0.2.10
#     names:
#       - ipa01.example.com
#       - ipa01
#   - ip: 192.0.2.11
#     names:
#       - ipa02.example.com
#       - ipa02
#
# Example IP-only entries:
# linux_ipa_client_hosts:
#   - name: vm-101
#     ansible_host: 192.0.2.101
#   - name: vm-102
#     ansible_host: 192.0.2.102
#     ipa_hostname: ubuntu-jump-01.example.com
#
# Example Proxmox discovery:
# linux_ipa_proxmox_discovery_enabled: true
# linux_ipa_proxmox_discovery_nodes:
#   - pve01.example.com
linux_ipa_proxmox_discovery_enabled: false
linux_ipa_proxmox_discovery_nodes: []
linux_ipa_proxmox_discovery_only_running: true
linux_ipa_proxmox_discovery_skip_missing_ip: true
linux_ipa_proxmox_discovery_ip_preference: ipv4
linux_ipa_proxmox_discovery_inventory_prefix: proxmox
# When enabled, only Proxmox VM names that are already FQDNs are used as
# hostname hints. Short VM names are not promoted into FreeIPA hostnames.
linux_ipa_proxmox_discovery_use_vm_name_as_hint: true
