---
- name: Validate FreeIPA access model inputs
  ansible.builtin.assert:
    that:
      - freeipa_access_model_admin_principal | length > 0
      - freeipa_access_model_admin_password | length > 0
    fail_msg: >-
      freeipa_access_model_admin_principal and freeipa_access_model_admin_password
      must be set.
