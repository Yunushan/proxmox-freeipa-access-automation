---
linux_ipa_runtime_group: linux_ipa_clients_runtime
linux_ipa_ssh_host_key_policy: accept_new
linux_ipa_ssh_bootstrap_enabled: false
linux_ipa_ssh_bootstrap_password: ""
linux_ipa_qga_ssh_bootstrap_enabled: false
linux_ipa_proxmox_discovery_enabled: false
linux_ipa_proxmox_discovery_nodes: []
linux_ipa_proxmox_discovery_vmids: []
linux_ipa_proxmox_discovery_only_running: true
linux_ipa_proxmox_discovery_skip_missing_ip: true
linux_ipa_proxmox_discovery_ip_preference: ipv4
linux_ipa_proxmox_discovery_inventory_prefix: proxmox
linux_ipa_proxmox_discovery_use_vm_name_as_hint: true
linux_ipa_proxmox_discovery_complete_short_vm_names_with_suffix: false
linux_ipa_proxmox_discovery_allowlist_enabled: false
linux_ipa_proxmox_discovery_allowlist_vmids: []
linux_ipa_proxmox_discovery_allowlist_ips: []
linux_ipa_proxmox_discovery_allowlist_names: []
linux_ipa_proxmox_discovery_ansible_user: ""
linux_ipa_proxmox_discovery_ansible_port: ""
linux_ipa_proxmox_discovery_ansible_password: ""
linux_ipa_proxmox_discovery_ansible_ssh_private_key_file: ""
linux_ipa_proxmox_discovery_ansible_become: ""
linux_ipa_proxmox_discovery_ansible_become_method: ""
linux_ipa_proxmox_discovery_ansible_become_password: ""
linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled: true
linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled: true
linux_ipa_proxmox_discovery_neighbor_ip_probe_interface_regex: '^vmbr'
linux_ipa_proxmox_discovery_neighbor_ip_probe_min_prefix: 24
linux_ipa_proxmox_discovery_neighbor_ip_probe_install_tools: true
linux_ipa_proxmox_discovery_neighbor_ip_probe_packages:
  - iputils-arping
  - fping
linux_ipa_proxmox_discovery_neighbor_ip_probe_arping_enabled: true
linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_fallback_enabled: true
linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_parallelism: 64
linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_timeout: 1
