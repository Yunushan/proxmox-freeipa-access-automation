---
- name: Resolve a usable guest-agent IP address
  vars:
    linux_ipa_proxmox_discovered_ip_raw: >-
      {% set addresses = [] %}
      {% if linux_ipa_proxmox_guest_network_result.rc == 0 and (linux_ipa_proxmox_guest_network_result.stdout | default('') | length > 0) %}
      {%   for interface in (linux_ipa_proxmox_guest_network_result.stdout | from_json) %}
      {%     for address in interface['ip-addresses'] | default([]) %}
      {%       set current_ip = address['ip-address'] | default('') %}
      {%       set current_type = address['ip-address-type'] | default('') %}
      {%       if linux_ipa_proxmox_discovery_ip_preference == 'ipv4'
              and current_type == 'ipv4'
              and not current_ip.startswith('127.')
              and not current_ip.startswith('169.254.') %}
      {%         set _ = addresses.append(current_ip) %}
      {%       elif linux_ipa_proxmox_discovery_ip_preference == 'ipv6'
                and current_type == 'ipv6'
                and current_ip != '::1'
                and not current_ip.startswith('fe80:') %}
      {%         set _ = addresses.append(current_ip) %}
      {%       elif linux_ipa_proxmox_discovery_ip_preference == 'any'
                and (
                  (current_type == 'ipv4'
                   and not current_ip.startswith('127.')
                   and not current_ip.startswith('169.254.'))
                  or
                  (current_type == 'ipv6'
                   and current_ip != '::1'
                   and not current_ip.startswith('fe80:'))
                ) %}
      {%         set _ = addresses.append(current_ip) %}
      {%       endif %}
      {%     endfor %}
      {%   endfor %}
      {% endif %}
      {{ addresses | first | default('') }}
    linux_ipa_proxmox_discovered_ip_from_config_raw: >-
      {% set addresses = [] %}
      {% if linux_ipa_proxmox_guest_config_result.rc | default(1) == 0 and (linux_ipa_proxmox_guest_config_result.stdout | default('') | length > 0) %}
      {%   for raw_line in (linux_ipa_proxmox_guest_config_result.stdout | default('') | split('\n')) %}
      {%     set line = raw_line | trim %}
      {%     if line.startswith('ipconfig') and ':' in line %}
      {%       for raw_field in (line.split(':', 1)[1] | string).split(',') %}
      {%         set current_field = raw_field | trim %}
      {%         if current_field.startswith('ip=') %}
      {%           set current_ip = (current_field | regex_replace('^ip=', '') | trim).split('/')[0] %}
      {%           if linux_ipa_proxmox_discovery_ip_preference == 'ipv4'
                  and current_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
                  and not current_ip.startswith('127.')
                  and not current_ip.startswith('169.254.') %}
      {%             set _ = addresses.append(current_ip) %}
      {%           elif linux_ipa_proxmox_discovery_ip_preference == 'ipv6'
                    and current_ip is match('^[0-9A-Fa-f:]+$')
                    and current_ip != '::1'
                    and not current_ip.startswith('fe80:') %}
      {%             set _ = addresses.append(current_ip) %}
      {%           elif linux_ipa_proxmox_discovery_ip_preference == 'any'
                    and (
                      (
                        current_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
                        and not current_ip.startswith('127.')
                        and not current_ip.startswith('169.254.')
                      )
                      or
                      (
                        current_ip is match('^[0-9A-Fa-f:]+$')
                        and current_ip != '::1'
                        and not current_ip.startswith('fe80:')
                      )
                    ) %}
      {%             set _ = addresses.append(current_ip) %}
      {%           endif %}
      {%         endif %}
      {%       endfor %}
      {%     endif %}
      {%   endfor %}
      {% endif %}
      {{ addresses | first | default('') }}
    linux_ipa_proxmox_discovered_ip_from_cloudinit_raw: >-
      {% set addresses = [] %}
      {% if linux_ipa_proxmox_guest_cloudinit_network_result.rc | default(1) == 0 and (linux_ipa_proxmox_guest_cloudinit_network_result.stdout | default('') | trim | length > 0) %}
      {%   set cloudinit_network = (linux_ipa_proxmox_guest_cloudinit_network_result.stdout | from_yaml) | default({}, true) %}
      {%   set net_root = cloudinit_network.network | default(cloudinit_network, true) %}
      {%   for iface_name, iface_cfg in (net_root.ethernets | default({})).items() %}
      {%     for raw_address in (iface_cfg.addresses | default([])) %}
      {%       set current_ip = (raw_address | string | trim).split('/')[0] %}
      {%       if linux_ipa_proxmox_discovery_ip_preference == 'ipv4'
              and current_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
              and not current_ip.startswith('127.')
              and not current_ip.startswith('169.254.') %}
      {%         set _ = addresses.append(current_ip) %}
      {%       elif linux_ipa_proxmox_discovery_ip_preference == 'ipv6'
                and current_ip is match('^[0-9A-Fa-f:]+$')
                and current_ip != '::1'
                and not current_ip.startswith('fe80:') %}
      {%         set _ = addresses.append(current_ip) %}
      {%       elif linux_ipa_proxmox_discovery_ip_preference == 'any'
                and (
                  (
                    current_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
                    and not current_ip.startswith('127.')
                    and not current_ip.startswith('169.254.')
                  )
                  or
                  (
                    current_ip is match('^[0-9A-Fa-f:]+$')
                    and current_ip != '::1'
                    and not current_ip.startswith('fe80:')
                  )
                ) %}
      {%         set _ = addresses.append(current_ip) %}
      {%       endif %}
      {%     endfor %}
      {%   endfor %}
      {% endif %}
      {{ addresses | first | default('') }}
    linux_ipa_proxmox_discovered_ip_from_neighbors_raw: >-
      {% set macs = [] %}
      {% set addresses = [] %}
      {% if linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool %}
      {%   if linux_ipa_proxmox_guest_config_result.rc | default(1) == 0 and (linux_ipa_proxmox_guest_config_result.stdout | default('') | length > 0) %}
      {%     for raw_line in (linux_ipa_proxmox_guest_config_result.stdout | default('') | split('\n')) %}
      {%       set line = raw_line | trim %}
      {%       if line.startswith('net') and ':' in line %}
      {%         set current_mac = (line | regex_search('(?i)([0-9a-f]{2}(?::[0-9a-f]{2}){5})') | default('', true) | string | lower) %}
      {%         if current_mac | length > 0 %}
      {%           set _ = macs.append(current_mac) %}
      {%         endif %}
      {%       endif %}
      {%     endfor %}
      {%   endif %}
      {%   for neighbor in (linux_ipa_proxmox_host_neighbors | default([])) %}
      {%     set current_mac = neighbor.lladdr | default('', true) | string | lower | trim %}
      {%     set current_ip = neighbor.dst | default('', true) | string | trim %}
      {%     if current_mac in macs %}
      {%       if linux_ipa_proxmox_discovery_ip_preference == 'ipv4'
              and current_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
              and not current_ip.startswith('127.')
              and not current_ip.startswith('169.254.') %}
      {%         set _ = addresses.append(current_ip) %}
      {%       elif linux_ipa_proxmox_discovery_ip_preference == 'ipv6'
                and current_ip is match('^[0-9A-Fa-f:]+$')
                and current_ip != '::1'
                and not current_ip.startswith('fe80:') %}
      {%         set _ = addresses.append(current_ip) %}
      {%       elif linux_ipa_proxmox_discovery_ip_preference == 'any'
                and (
                  (
                    current_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
                    and not current_ip.startswith('127.')
                    and not current_ip.startswith('169.254.')
                  )
                  or
                  (
                    current_ip is match('^[0-9A-Fa-f:]+$')
                    and current_ip != '::1'
                    and not current_ip.startswith('fe80:')
                  )
                ) %}
      {%         set _ = addresses.append(current_ip) %}
      {%       endif %}
      {%     endif %}
      {%   endfor %}
      {% endif %}
      {{ addresses | unique | first | default('') }}
  ansible.builtin.set_fact:
    linux_ipa_proxmox_discovered_ip: >-
      {{
        (
          linux_ipa_proxmox_discovered_ip_raw
          if (linux_ipa_proxmox_discovered_ip_raw | trim | length > 0)
          else (
            linux_ipa_proxmox_discovered_ip_from_config_raw
            if (linux_ipa_proxmox_discovered_ip_from_config_raw | trim | length > 0)
            else (
              linux_ipa_proxmox_discovered_ip_from_cloudinit_raw
              if (linux_ipa_proxmox_discovered_ip_from_cloudinit_raw | trim | length > 0)
              else linux_ipa_proxmox_discovered_ip_from_neighbors_raw
            )
          )
        )
        | trim
      }}
    linux_ipa_proxmox_discovered_ip_source: >-
      {{
        'guest_agent'
        if (linux_ipa_proxmox_discovered_ip_raw | trim | length > 0)
        else (
          'qm_config'
          if (linux_ipa_proxmox_discovered_ip_from_config_raw | trim | length > 0)
          else (
            'cloudinit_network'
            if (linux_ipa_proxmox_discovered_ip_from_cloudinit_raw | trim | length > 0)
            else (
              'neighbor_table'
              if (linux_ipa_proxmox_discovered_ip_from_neighbors_raw | trim | length > 0)
              else ''
            )
          )
        )
      }}

- name: Derive Proxmox discovery runtime identifiers and admission decisions
  vars:
    linux_ipa_proxmox_discovery_runtime_host_name_resolved: >-
      {{
        linux_ipa_proxmox_discovery_inventory_prefix
        ~ '-'
        ~ linux_ipa_proxmox_node_shortname.stdout
        ~ '-vm'
        ~ (linux_ipa_proxmox_guest_network_result.item.vmid | string)
      }}
    linux_ipa_proxmox_discovery_vm_name_normalized_resolved: >-
      {{
        linux_ipa_proxmox_guest_network_result.item.name
        | default('', true)
        | string
        | trim
        | lower
      }}
    linux_ipa_proxmox_discovery_vm_name_sanitized_resolved: >-
      {{
        linux_ipa_proxmox_guest_network_result.item.name
        | default('', true)
        | string
        | trim
        | lower
        | regex_replace('[^a-z0-9-]+', '-')
        | regex_replace('^-+', '')
        | regex_replace('-+$', '')
        | regex_replace('-{2,}', '-')
      }}
    linux_ipa_proxmox_discovery_requested_hostname_candidate_resolved: >-
      {{
        linux_ipa_proxmox_discovery_vm_name_normalized_resolved
        if (
          linux_ipa_proxmox_discovery_use_vm_name_as_hint | bool
          and '.' in linux_ipa_proxmox_discovery_vm_name_normalized_resolved
          and (linux_ipa_proxmox_discovery_vm_name_normalized_resolved | length > 0)
        )
        else (
          (
            linux_ipa_proxmox_discovery_vm_name_sanitized_resolved
            ~ '.'
            ~ (linux_ipa_identity_hostname_suffix | trim | lower)
          )
          if (
            linux_ipa_proxmox_discovery_use_vm_name_as_hint | bool
            and linux_ipa_proxmox_discovery_complete_short_vm_names_with_suffix | bool
            and '.' not in linux_ipa_proxmox_discovery_vm_name_normalized_resolved
            and linux_ipa_identity_hostname_suffix | default('') | trim | length > 0
            and linux_ipa_proxmox_discovery_vm_name_sanitized_resolved | length > 0
            and linux_ipa_proxmox_discovery_vm_name_sanitized_resolved is match('^[a-z0-9][a-z0-9-]*$')
            and not (linux_ipa_proxmox_discovery_vm_name_sanitized_resolved is match('^[0-9]+$'))
          )
          else ''
        )
      }}
    linux_ipa_proxmox_discovery_allowlist_vmids_effective: >-
      {{
        (
          linux_ipa_proxmox_discovery_allowlist_vmids
          if (
            linux_ipa_proxmox_discovery_allowlist_vmids is sequence
            and linux_ipa_proxmox_discovery_allowlist_vmids is not string
          )
          else (
            linux_ipa_proxmox_discovery_allowlist_vmids
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
    linux_ipa_proxmox_discovery_allowlist_ips_effective: >-
      {{
        (
          linux_ipa_proxmox_discovery_allowlist_ips
          if (
            linux_ipa_proxmox_discovery_allowlist_ips is sequence
            and linux_ipa_proxmox_discovery_allowlist_ips is not string
          )
          else (
            linux_ipa_proxmox_discovery_allowlist_ips
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | list
      }}
    linux_ipa_proxmox_discovery_allowlist_names_effective: >-
      {{
        (
          linux_ipa_proxmox_discovery_allowlist_names
          if (
            linux_ipa_proxmox_discovery_allowlist_names is sequence
            and linux_ipa_proxmox_discovery_allowlist_names is not string
          )
          else (
            linux_ipa_proxmox_discovery_allowlist_names
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | list
      }}
    linux_ipa_proxmox_discovery_blacklist_vmids_effective: >-
      {{
        (
          linux_ipa_proxmox_discovery_blacklist_vmids
          if (
            linux_ipa_proxmox_discovery_blacklist_vmids is sequence
            and linux_ipa_proxmox_discovery_blacklist_vmids is not string
          )
          else (
            linux_ipa_proxmox_discovery_blacklist_vmids
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
    linux_ipa_proxmox_discovery_blacklist_ips_effective: >-
      {{
        (
          linux_ipa_proxmox_discovery_blacklist_ips
          if (
            linux_ipa_proxmox_discovery_blacklist_ips is sequence
            and linux_ipa_proxmox_discovery_blacklist_ips is not string
          )
          else (
            linux_ipa_proxmox_discovery_blacklist_ips
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | list
      }}
    linux_ipa_proxmox_discovery_blacklist_names_effective: >-
      {{
        (
          linux_ipa_proxmox_discovery_blacklist_names
          if (
            linux_ipa_proxmox_discovery_blacklist_names is sequence
            and linux_ipa_proxmox_discovery_blacklist_names is not string
          )
          else (
            linux_ipa_proxmox_discovery_blacklist_names
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | list
      }}
    linux_ipa_proxmox_discovery_allowlist_candidate_names_resolved: >-
      {{
        [
          linux_ipa_proxmox_discovery_runtime_host_name_resolved,
          (linux_ipa_proxmox_guest_network_result.item.name | default('', true) | string | trim),
          linux_ipa_proxmox_discovery_requested_hostname_candidate_resolved
        ]
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | unique
        | list
      }}
  ansible.builtin.set_fact:
    linux_ipa_proxmox_discovery_runtime_host_name: "{{ linux_ipa_proxmox_discovery_runtime_host_name_resolved }}"
    linux_ipa_proxmox_discovery_requested_hostname_candidate: "{{ linux_ipa_proxmox_discovery_requested_hostname_candidate_resolved }}"
    linux_ipa_proxmox_discovery_allowlist_candidate_names: "{{ linux_ipa_proxmox_discovery_allowlist_candidate_names_resolved }}"
    linux_ipa_proxmox_discovery_allowlist_permitted: >-
      {{
        not (linux_ipa_proxmox_discovery_allowlist_enabled | bool)
        or (
          (linux_ipa_proxmox_guest_network_result.item.vmid | string)
          in linux_ipa_proxmox_discovery_allowlist_vmids_effective
        )
        or (
          (linux_ipa_proxmox_discovered_ip | default('', true) | string | trim | lower)
          in linux_ipa_proxmox_discovery_allowlist_ips_effective
        )
        or (
          (
            linux_ipa_proxmox_discovery_allowlist_candidate_names_resolved
            | intersect(linux_ipa_proxmox_discovery_allowlist_names_effective)
            | length
          ) > 0
        )
      }}
    linux_ipa_proxmox_discovery_blacklisted: >-
      {{
        (
          (
            linux_ipa_proxmox_guest_network_result.item.vmid
            | default('', true)
            | string
          )
          in (linux_ipa_proxmox_discovery_blacklist_vmids_effective | default([]))
        )
        or (
          (linux_ipa_proxmox_discovered_ip | default('', true) | string | trim | lower)
          in (linux_ipa_proxmox_discovery_blacklist_ips_effective | default([]))
        )
        or (
          (
            linux_ipa_proxmox_discovery_allowlist_candidate_names_resolved
            | default([])
            | intersect(linux_ipa_proxmox_discovery_blacklist_names_effective | default([]))
            | length
          ) > 0
        )
      }}
  changed_when: false

- name: Warn when Proxmox discovery falls back to VM config IP data
  ansible.builtin.debug:
    msg: >-
      Proxmox guest-agent network discovery did not return a usable IP for
      VM {{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}.
      Falling back to the static VM config IP {{ linux_ipa_proxmox_discovered_ip }}
      so later SSH-based tasks can still try to manage the guest.
  changed_when: false
  when:
    - linux_ipa_proxmox_discovered_ip | length > 0
    - linux_ipa_proxmox_discovered_ip_source == 'qm_config'

- name: Warn when Proxmox discovery falls back to VM cloud-init network data
  ansible.builtin.debug:
    msg: >-
      Proxmox guest-agent network discovery did not return a usable IP for
      VM {{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}.
      Falling back to the cloud-init network IP {{ linux_ipa_proxmox_discovered_ip }}
      so later SSH-based tasks can still try to manage the guest.
  changed_when: false
  when:
    - linux_ipa_proxmox_discovered_ip | length > 0
    - linux_ipa_proxmox_discovered_ip_source == 'cloudinit_network'

- name: Warn when Proxmox discovery falls back to host neighbor-table data
  ansible.builtin.debug:
    msg: >-
      Proxmox guest-agent, VM config, and cloud-init network discovery did not return a usable IP for
      VM {{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}.
      Falling back to the Proxmox host neighbor-table IP {{ linux_ipa_proxmox_discovered_ip }}
      matched from the VM NIC MAC address so later SSH-based tasks can still try to manage the guest.
  changed_when: false
  when:
    - linux_ipa_proxmox_discovered_ip | length > 0
    - linux_ipa_proxmox_discovered_ip_source == 'neighbor_table'

- name: Fail when a discovered VM has no usable guest-agent IP
  ansible.builtin.assert:
    that:
      - linux_ipa_proxmox_discovered_ip | length > 0
    fail_msg: >-
      No usable {{ linux_ipa_proxmox_discovery_ip_preference }} address was found
      for VM {{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}
      on node {{ linux_ipa_proxmox_node_shortname.stdout }}. Ensure the VM is running and
      the QEMU guest agent can report network interfaces, or enable
      linux_ipa_proxmox_discovery_skip_missing_ip to skip it.
  when:
    - not linux_ipa_proxmox_discovery_skip_missing_ip | bool

- name: Warn when a discovered VM has no usable IP source and will be skipped
  ansible.builtin.debug:
    msg: >-
      Skipping VM {{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}
      on node {{ linux_ipa_proxmox_node_shortname.stdout }} because no usable IP could be discovered.
      Proxmox discovery could not get an address from the guest agent, and the VM config does not expose
      any static ipconfigN address, readable cloud-init network address, or neighbor-table match either. A guest-side netplan file is not visible to Proxmox, so it cannot
      be used as an automatic discovery source from the host. Provide one of the following:
      enable qemu-guest-agent inside the VM, define the VM IP with qm ipconfig/cloud-init, or add the VM
      explicitly under linux_ipa_client_hosts with ansible_host.
  changed_when: false
  when:
    - linux_ipa_proxmox_discovery_skip_missing_ip | bool
    - linux_ipa_proxmox_discovered_ip | length == 0

- name: Warn when Proxmox discovery skips a VM that is outside the allowlist
  ansible.builtin.debug:
    msg: >-
      Skipping VM {{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}
      on node {{ linux_ipa_proxmox_node_shortname.stdout }} because Proxmox discovery allowlist enforcement is enabled
      and this guest did not match.
      Current identifiers: vmid={{ linux_ipa_proxmox_guest_network_result.item.vmid }},
      ip={{ linux_ipa_proxmox_discovered_ip | default('none', true) }},
      names={{ linux_ipa_proxmox_discovery_allowlist_candidate_names | default([]) | join(', ') | default('none', true) }}.
      Allowed VMIDs={{ linux_ipa_proxmox_discovery_allowlist_vmids | default([]) | join(', ') | default('none', true) }},
      allowed IPs={{ linux_ipa_proxmox_discovery_allowlist_ips | default([]) | join(', ') | default('none', true) }},
      allowed names={{ linux_ipa_proxmox_discovery_allowlist_names | default([]) | join(', ') | default('none', true) }}.
  changed_when: false
  when:
    - linux_ipa_proxmox_discovered_ip | length > 0
    - linux_ipa_proxmox_discovery_allowlist_enabled | bool
    - not (linux_ipa_proxmox_discovery_blacklisted | bool)
    - not (linux_ipa_proxmox_discovery_allowlist_permitted | bool)

- name: Warn when Proxmox discovery skips a VM that matches the blacklist
  ansible.builtin.debug:
    msg: >-
      Skipping VM {{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}
      on node {{ linux_ipa_proxmox_node_shortname.stdout }} because it matched the Proxmox discovery blacklist.
      Current identifiers: vmid={{ linux_ipa_proxmox_guest_network_result.item.vmid }},
      ip={{ linux_ipa_proxmox_discovered_ip | default('none', true) }},
      names={{ linux_ipa_proxmox_discovery_allowlist_candidate_names | default([]) | join(', ') | default('none', true) }}.
      Blacklisted VMIDs={{ linux_ipa_proxmox_discovery_blacklist_vmids | default([]) | join(', ') | default('none', true) }},
      blacklisted IPs={{ linux_ipa_proxmox_discovery_blacklist_ips | default([]) | join(', ') | default('none', true) }},
      blacklisted names={{ linux_ipa_proxmox_discovery_blacklist_names | default([]) | join(', ') | default('none', true) }}.
  changed_when: false
  when:
    - linux_ipa_proxmox_discovered_ip | length > 0
    - linux_ipa_proxmox_discovery_blacklisted | bool

- name: Add discovered Proxmox VMs to the Linux IPA runtime group
  vars:
    linux_ipa_proxmox_discovery_ssh_common_args_default: >-
      {{
        '-o StrictHostKeyChecking=accept-new'
        if linux_ipa_ssh_host_key_policy == 'accept_new'
        else (
          '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          if linux_ipa_ssh_host_key_policy == 'disabled'
          else ''
        )
      }}
  ansible.builtin.add_host:
    name: "{{ linux_ipa_proxmox_discovery_runtime_host_name }}"
    groups: "{{ linux_ipa_runtime_group }}"
    ansible_host: "{{ linux_ipa_proxmox_discovered_ip | trim }}"
    ansible_user: "{{ linux_ipa_proxmox_discovery_ansible_user | default(omit, true) }}"
    ansible_port: "{{ linux_ipa_proxmox_discovery_ansible_port | default(omit, true) }}"
    ansible_password: >-
      {{
        (
          linux_ipa_proxmox_discovery_ansible_password
          | default(linux_ipa_ssh_bootstrap_password, true)
        )
        if (
          (linux_ipa_proxmox_discovery_ansible_password | default('', true) | string | trim | length > 0)
          or (linux_ipa_ssh_bootstrap_password | default('', true) | string | trim | length > 0)
        )
        else omit
      }}
    ansible_ssh_private_key_file: "{{ linux_ipa_proxmox_discovery_ansible_ssh_private_key_file | default(omit, true) }}"
    ansible_become: >-
      {{
        linux_ipa_proxmox_discovery_ansible_become
        if (
          linux_ipa_proxmox_discovery_ansible_become
          | default('', true)
          | string
          | trim
          | length
        ) > 0
        else omit
      }}
    ansible_become_method: >-
      {{
        linux_ipa_proxmox_discovery_ansible_become_method
        if (
          linux_ipa_proxmox_discovery_ansible_become_method
          | default('', true)
          | string
          | trim
          | length
        ) > 0
        else omit
      }}
    ansible_become_password: >-
      {{
        linux_ipa_proxmox_discovery_ansible_become_password
        if (
          linux_ipa_proxmox_discovery_ansible_become_password
          | default('', true)
          | string
          | trim
          | length
        ) > 0
        else omit
      }}
    ansible_ssh_common_args: "{{ linux_ipa_proxmox_discovery_ssh_common_args_default if (linux_ipa_proxmox_discovery_ssh_common_args_default | length > 0) else omit }}"
    linux_freeipa_enroll_manage_hostname: "{{ linux_freeipa_enroll_manage_hostname | default(omit) }}"
    linux_freeipa_enroll_pin_local_hostname_in_etc_hosts: "{{ linux_freeipa_enroll_pin_local_hostname_in_etc_hosts | default(omit) }}"
    linux_ipa_requested_hostname: >-
      {{
        (
          linux_ipa_proxmox_discovery_requested_hostname_candidate | default('', true) | length > 0
        ) | ternary(linux_ipa_proxmox_discovery_requested_hostname_candidate, omit)
      }}
    linux_ipa_requested_hostname_source: >-
      {{
        (
          'proxmox_vm_name_completed_with_suffix'
          if (
            linux_ipa_proxmox_discovery_requested_hostname_candidate | default('', true) | length > 0
            and linux_ipa_proxmox_discovery_complete_short_vm_names_with_suffix | bool
            and '.' not in (
              linux_ipa_proxmox_guest_network_result.item.name
              | default('', true)
              | string
              | trim
            )
          )
          else 'proxmox_vm_name_fqdn'
        )
        if (
          linux_ipa_proxmox_discovery_requested_hostname_candidate | default('', true) | length > 0
        )
        else omit
      }}
    linux_ipa_source: proxmox_discovery
    linux_ipa_proxmox_node: "{{ linux_ipa_proxmox_node_shortname.stdout }}"
    linux_ipa_proxmox_node_inventory_host: "{{ inventory_hostname }}"
    linux_ipa_proxmox_vmid: "{{ linux_ipa_proxmox_guest_network_result.item.vmid }}"
    linux_ipa_proxmox_vm_name: "{{ linux_ipa_proxmox_guest_network_result.item.name | default('vm-' ~ linux_ipa_proxmox_guest_network_result.item.vmid) }}"
    linux_freeipa_enroll_split_dns_public_dns_mode: >-
      {{
        linux_freeipa_enroll_split_dns_public_dns_mode
        | default(hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_mode, true)
        | default(omit)
      }}
    linux_freeipa_enroll_split_dns_public_dns_servers: >-
      {{
        linux_freeipa_enroll_split_dns_public_dns_servers
        | default(hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_servers, true)
        | default(omit)
      }}
  when:
    - linux_ipa_proxmox_discovered_ip | length > 0
    - linux_ipa_proxmox_discovery_allowlist_permitted | bool
    - not (linux_ipa_proxmox_discovery_blacklisted | bool)
  changed_when: false
