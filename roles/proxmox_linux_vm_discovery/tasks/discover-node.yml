---
- name: Normalize optional Proxmox discovery VMID filters for this node
  ansible.builtin.set_fact:
    linux_ipa_proxmox_discovery_vmids_normalized: >-
      {{
        linux_ipa_proxmox_discovery_vmids
        | default([])
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  changed_when: false

- name: Read Proxmox node short name
  ansible.builtin.command: hostname -s
  become: true
  register: linux_ipa_proxmox_node_shortname
  check_mode: false
  changed_when: false

- name: Read QEMU guests from Proxmox node
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ linux_ipa_proxmox_node_shortname.stdout }}/qemu"
      - --output-format
      - json
  become: true
  register: linux_ipa_proxmox_node_guests_raw
  check_mode: false
  changed_when: false

- name: Initialize selected QEMU guests for Linux IPA discovery
  ansible.builtin.set_fact:
    linux_ipa_proxmox_node_guests: []

- name: Select QEMU guests for Linux IPA discovery
  ansible.builtin.set_fact:
    linux_ipa_proxmox_node_guests: "{{ linux_ipa_proxmox_node_guests + [item] }}"
  loop: "{{ linux_ipa_proxmox_node_guests_raw.stdout | from_json }}"
  loop_control:
    label: "{{ item.name | default('vm-' ~ item.vmid) }}"
  when:
    - not (item.template | default(0) | bool)
    - (linux_ipa_proxmox_discovery_vmids_normalized | length == 0) or ((item.vmid | string) in linux_ipa_proxmox_discovery_vmids_normalized)
    - (not linux_ipa_proxmox_discovery_only_running | bool) or (item.status | default('') == 'running')

- name: Read guest network interfaces through the Proxmox guest agent
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - cmd
      - "{{ item.vmid | string }}"
      - network-get-interfaces
  become: true
  register: linux_ipa_proxmox_guest_networks
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_node_guests }}"
  loop_control:
    label: "{{ item.name | default('vm-' ~ item.vmid) }}"

- name: Read Proxmox VM configuration for discovery IP fallback
  ansible.builtin.command:
    argv:
      - qm
      - config
      - "{{ item.vmid | string }}"
  become: true
  register: linux_ipa_proxmox_guest_configs
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_node_guests }}"
  loop_control:
    label: "{{ item.name | default('vm-' ~ item.vmid) }}"

- name: Read Proxmox VM cloud-init network config for discovery IP fallback
  ansible.builtin.command:
    argv:
      - qm
      - cloudinit
      - dump
      - "{{ item.vmid | string }}"
      - network
  become: true
  register: linux_ipa_proxmox_guest_cloudinit_networks
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_node_guests }}"
  loop_control:
    label: "{{ item.name | default('vm-' ~ item.vmid) }}"

- name: Read Proxmox host IPv4 addresses for neighbor-table probe fallback
  ansible.builtin.command:
    argv:
      - ip
      - -j
      - -4
      - addr
      - show
  become: true
  register: linux_ipa_proxmox_host_ipv4_addrs_raw
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool

- name: Ensure Proxmox neighbor-table probe tools are installed
  ansible.builtin.apt:
    name: "{{ linux_ipa_proxmox_discovery_neighbor_ip_probe_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_install_tools | bool

- name: Read the Proxmox host neighbor table before neighbor-table probe fallback
  ansible.builtin.command:
    argv:
      - ip
      - -j
      - neigh
      - show
  become: true
  register: linux_ipa_proxmox_host_neighbors_preprobe_raw
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool

- name: Build eligible Proxmox subnet probes for neighbor-table fallback
  ansible.builtin.shell: |
    set -euo pipefail

    if command -v python3 >/dev/null 2>&1; then
      probe_python=python3
    elif command -v python >/dev/null 2>&1; then
      probe_python=python
    else
      printf '[]'
      exit 0
    fi

    "$probe_python" - <<'PY'
    import ipaddress
    import json
    import os
    import re

    iface_pattern = re.compile(os.environ['IFACE_REGEX'])
    min_prefix = int(os.environ['MIN_PREFIX'])
    host_addrs = json.loads(os.environ['HOST_IPV4_ADDRS'])
    host_neighbors = json.loads(os.environ['HOST_NEIGHBORS'])

    targets = []
    seen = set()

    def add_target(ifname, cidr):
        key = (ifname, cidr)
        if key not in seen:
            seen.add(key)
            targets.append({'ifname': ifname, 'cidr': cidr})

    for iface in host_addrs:
        ifname = str(iface.get('ifname', '')).strip()
        if not ifname or ifname == 'lo' or not iface_pattern.search(ifname):
            continue
        for addr in iface.get('addr_info', []):
            if str(addr.get('family', '')).strip() != 'inet':
                continue
            local = str(addr.get('local', '')).strip()
            if not local or local.startswith('127.') or local.startswith('169.254.'):
                continue
            prefix = int(addr.get('prefixlen', 0) or 0)
            if prefix <= 0:
                continue
            probe_prefix = prefix if prefix >= min_prefix else min_prefix
            add_target(ifname, str(ipaddress.ip_network(f'{local}/{probe_prefix}', strict=False)))

    for neighbor in host_neighbors:
        ifname = str(neighbor.get('dev', '')).strip()
        dst = str(neighbor.get('dst', '')).strip()
        if not ifname or ifname == 'lo' or not iface_pattern.search(ifname):
            continue
        try:
            current_ip = ipaddress.ip_address(dst)
        except ValueError:
            continue
        if current_ip.version != 4 or current_ip.is_loopback or current_ip.is_link_local:
            continue
        add_target(ifname, str(ipaddress.ip_network(f'{dst}/{min_prefix}', strict=False)))

    print(json.dumps(targets))
    PY
  args:
    executable: /bin/bash
  environment:
    HOST_IPV4_ADDRS: "{{ linux_ipa_proxmox_host_ipv4_addrs_raw.stdout | default('[]') }}"
    HOST_NEIGHBORS: "{{ linux_ipa_proxmox_host_neighbors_preprobe_raw.stdout | default('[]') }}"
    IFACE_REGEX: "{{ linux_ipa_proxmox_discovery_neighbor_ip_probe_interface_regex }}"
    MIN_PREFIX: "{{ linux_ipa_proxmox_discovery_neighbor_ip_probe_min_prefix | int | string }}"
  register: linux_ipa_proxmox_neighbor_probe_targets_raw
  changed_when: false
  failed_when: false
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool

- name: Normalize eligible Proxmox subnet probes for neighbor-table fallback
  ansible.builtin.set_fact:
    linux_ipa_proxmox_neighbor_probe_targets: "{{ linux_ipa_proxmox_neighbor_probe_targets_raw.stdout | default('[]') | from_json }}"
    linux_ipa_proxmox_neighbor_probe_cidrs: >-
      {{
        (
          linux_ipa_proxmox_neighbor_probe_targets_raw.stdout
          | default('[]')
          | from_json
          | map(attribute='cidr')
          | unique
          | list
        )
      }}
  changed_when: false
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool

- name: Resolve the Proxmox neighbor-table probe tool path
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v fping >/dev/null 2>&1; then
      command -v fping
    elif command -v nmap >/dev/null 2>&1; then
      command -v nmap
    fi
  args:
    executable: /bin/bash
  register: linux_ipa_proxmox_neighbor_probe_tool_path
  changed_when: false
  failed_when: false
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool
    - linux_ipa_proxmox_neighbor_probe_cidrs | default([]) | length > 0

- name: Resolve the Proxmox ARP sweep tool path
  ansible.builtin.shell: |
    set -euo pipefail
    command -v arping >/dev/null 2>&1 && command -v arping
  args:
    executable: /bin/bash
  register: linux_ipa_proxmox_neighbor_probe_arping_path
  changed_when: false
  failed_when: false
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_arping_enabled | bool
    - linux_ipa_proxmox_neighbor_probe_targets | default([]) | length > 0

- name: Probe eligible Proxmox subnets to refresh the neighbor table
  ansible.builtin.command:
    argv:
      - "{{ linux_ipa_proxmox_neighbor_probe_tool_path.stdout | trim }}"
      - -q
      - -g
      - "{{ item }}"
  become: true
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_neighbor_probe_cidrs | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool
    - linux_ipa_proxmox_neighbor_probe_cidrs | default([]) | length > 0
    - linux_ipa_proxmox_neighbor_probe_tool_path.stdout | default('') | trim | length > 0
    - (linux_ipa_proxmox_neighbor_probe_tool_path.stdout | trim | lower | basename) == 'fping'

- name: Probe eligible Proxmox subnets with nmap to refresh the neighbor table
  ansible.builtin.command:
    argv:
      - "{{ linux_ipa_proxmox_neighbor_probe_tool_path.stdout | trim }}"
      - -sn
      - "{{ item }}"
  become: true
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_neighbor_probe_cidrs | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool
    - linux_ipa_proxmox_neighbor_probe_cidrs | default([]) | length > 0
    - linux_ipa_proxmox_neighbor_probe_tool_path.stdout | default('') | trim | length > 0
    - (linux_ipa_proxmox_neighbor_probe_tool_path.stdout | trim | lower | basename) == 'nmap'

- name: Probe eligible Proxmox subnets with an ARP sweep to refresh the neighbor table
  ansible.builtin.shell: |
    set -euo pipefail

    ifname="{{ item.ifname }}"
    cidr="{{ item.cidr }}"
    parallelism="{{ linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_parallelism | int }}"
    timeout_seconds="{{ linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_timeout | int }}"

    if command -v python3 >/dev/null 2>&1; then
      probe_python=python3
    elif command -v python >/dev/null 2>&1; then
      probe_python=python
    else
      exit 0
    fi

    "$probe_python" - "$cidr" <<'PY' | xargs -r -n 1 -P "$parallelism" sh -c '
    "{{ linux_ipa_proxmox_neighbor_probe_arping_path.stdout | trim }}" -I "$1" -c 1 -w "$2" "$3" >/dev/null 2>&1 || true
    ' _ "$ifname" "$timeout_seconds"
    import ipaddress
    import sys

    for current_ip in ipaddress.ip_network(sys.argv[1], strict=False).hosts():
        print(current_ip)
    PY
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_neighbor_probe_targets | default([]) }}"
  loop_control:
    label: "{{ item.ifname }} {{ item.cidr }}"
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_arping_enabled | bool
    - linux_ipa_proxmox_neighbor_probe_targets | default([]) | length > 0
    - linux_ipa_proxmox_neighbor_probe_arping_path.stdout | default('') | trim | length > 0

- name: Probe eligible Proxmox subnets with a ping sweep to refresh the neighbor table
  ansible.builtin.shell: |
    set -euo pipefail

    cidr="{{ item }}"
    parallelism="{{ linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_parallelism | int }}"
    timeout_seconds="{{ linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_timeout | int }}"

    command -v ping >/dev/null 2>&1 || exit 0

    if command -v python3 >/dev/null 2>&1; then
      probe_python=python3
    elif command -v python >/dev/null 2>&1; then
      probe_python=python
    else
      exit 0
    fi

    "$probe_python" - "$cidr" <<'PY' | xargs -r -n 1 -P "$parallelism" sh -c '
    ping -c 1 -W "$1" "$2" >/dev/null 2>&1 || true
    ' _ "$timeout_seconds"
    import ipaddress
    import sys

    for current_ip in ipaddress.ip_network(sys.argv[1], strict=False).hosts():
        print(current_ip)
    PY
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_neighbor_probe_cidrs | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_enabled | bool
    - linux_ipa_proxmox_discovery_neighbor_ip_probe_ping_fallback_enabled | bool
    - linux_ipa_proxmox_neighbor_probe_cidrs | default([]) | length > 0
    - (linux_ipa_proxmox_neighbor_probe_tool_path.stdout | default('') | trim | length) == 0

- name: Read the Proxmox host neighbor table for discovery IP fallback
  ansible.builtin.command:
    argv:
      - ip
      - -j
      - neigh
      - show
  become: true
  register: linux_ipa_proxmox_host_neighbors_raw
  check_mode: false
  changed_when: false
  failed_when: false
  when: linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool

- name: Normalize the Proxmox host neighbor table for discovery IP fallback
  vars:
    linux_ipa_proxmox_host_neighbors_json: >-
      {{
        linux_ipa_proxmox_host_neighbors_raw.stdout
        if (
          linux_ipa_proxmox_host_neighbors_raw is defined
          and (linux_ipa_proxmox_host_neighbors_raw.rc | default(1) == 0)
          and (linux_ipa_proxmox_host_neighbors_raw.stdout | default('') | trim | length > 0)
        )
        else '[]'
      }}
  ansible.builtin.set_fact:
    linux_ipa_proxmox_host_neighbors: "{{ linux_ipa_proxmox_host_neighbors_json | from_json }}"
  changed_when: false
  when: linux_ipa_proxmox_discovery_neighbor_ip_fallback_enabled | bool

- name: Process discovered guest network results
  ansible.builtin.include_tasks: process-network-result.yml
  loop: "{{ range(0, (linux_ipa_proxmox_guest_networks.results | default([]) | length)) | list }}"
  loop_control:
    loop_var: linux_ipa_proxmox_guest_result_index
    label: "{{ linux_ipa_proxmox_guest_networks.results[linux_ipa_proxmox_guest_result_index].item.name | default('vm-' ~ linux_ipa_proxmox_guest_networks.results[linux_ipa_proxmox_guest_result_index].item.vmid) }}"
  vars:
    linux_ipa_proxmox_guest_network_result: "{{ linux_ipa_proxmox_guest_networks.results[linux_ipa_proxmox_guest_result_index] }}"
    linux_ipa_proxmox_guest_config_result: "{{ (linux_ipa_proxmox_guest_configs.results | default([]))[linux_ipa_proxmox_guest_result_index] | default({}) }}"
    linux_ipa_proxmox_guest_cloudinit_network_result: "{{ (linux_ipa_proxmox_guest_cloudinit_networks.results | default([]))[linux_ipa_proxmox_guest_result_index] | default({}) }}"
