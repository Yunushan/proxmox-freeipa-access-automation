---
- name: Normalize optional Proxmox discovery VMID filters for this node
  ansible.builtin.set_fact:
    linux_ipa_proxmox_discovery_vmids_normalized: >-
      {{
        linux_ipa_proxmox_discovery_vmids
        | default([])
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  changed_when: false

- name: Read Proxmox node short name
  ansible.builtin.command: hostname -s
  become: true
  register: linux_ipa_proxmox_node_shortname
  check_mode: false
  changed_when: false

- name: Read QEMU guests from Proxmox node
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ linux_ipa_proxmox_node_shortname.stdout }}/qemu"
      - --output-format
      - json
  become: true
  register: linux_ipa_proxmox_node_guests_raw
  check_mode: false
  changed_when: false

- name: Initialize selected QEMU guests for Linux IPA discovery
  ansible.builtin.set_fact:
    linux_ipa_proxmox_node_guests: []

- name: Select QEMU guests for Linux IPA discovery
  ansible.builtin.set_fact:
    linux_ipa_proxmox_node_guests: "{{ linux_ipa_proxmox_node_guests + [item] }}"
  loop: "{{ linux_ipa_proxmox_node_guests_raw.stdout | from_json }}"
  loop_control:
    label: "{{ item.name | default('vm-' ~ item.vmid) }}"
  when:
    - not (item.template | default(0) | bool)
    - (linux_ipa_proxmox_discovery_vmids_normalized | length == 0) or ((item.vmid | string) in linux_ipa_proxmox_discovery_vmids_normalized)
    - (not linux_ipa_proxmox_discovery_only_running | bool) or (item.status | default('') == 'running')

- name: Read guest network interfaces through the Proxmox guest agent
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - cmd
      - "{{ item.vmid | string }}"
      - network-get-interfaces
  become: true
  register: linux_ipa_proxmox_guest_networks
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_node_guests }}"
  loop_control:
    label: "{{ item.name | default('vm-' ~ item.vmid) }}"

- name: Read Proxmox VM configuration for discovery IP fallback
  ansible.builtin.command:
    argv:
      - qm
      - config
      - "{{ item.vmid | string }}"
  become: true
  register: linux_ipa_proxmox_guest_configs
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ linux_ipa_proxmox_node_guests }}"
  loop_control:
    label: "{{ item.name | default('vm-' ~ item.vmid) }}"

- name: Process discovered guest network results
  ansible.builtin.include_tasks: process-network-result.yml
  loop: "{{ range(0, (linux_ipa_proxmox_guest_networks.results | default([]) | length)) | list }}"
  loop_control:
    loop_var: linux_ipa_proxmox_guest_result_index
    label: "{{ linux_ipa_proxmox_guest_networks.results[linux_ipa_proxmox_guest_result_index].item.name | default('vm-' ~ linux_ipa_proxmox_guest_networks.results[linux_ipa_proxmox_guest_result_index].item.vmid) }}"
  vars:
    linux_ipa_proxmox_guest_network_result: "{{ linux_ipa_proxmox_guest_networks.results[linux_ipa_proxmox_guest_result_index] }}"
    linux_ipa_proxmox_guest_config_result: "{{ (linux_ipa_proxmox_guest_configs.results | default([]))[linux_ipa_proxmox_guest_result_index] | default({}) }}"
