---
- name: Read the current host FQDN
  ansible.builtin.command: hostname -f
  register: linux_ipa_current_fqdn
  check_mode: false
  changed_when: false
  failed_when: false

- name: Read the current host short hostname
  ansible.builtin.command: hostname -s
  register: linux_ipa_current_short_hostname
  check_mode: false
  changed_when: false
  failed_when: false

- name: Resolve the effective FreeIPA hostname for this Linux client
  ansible.builtin.set_fact:
    linux_ipa_effective_manage_hostname: >-
      {{
        (
          hostvars[inventory_hostname].linux_freeipa_enroll_manage_hostname
          if (
            (inventory_hostname in hostvars)
            and (hostvars[inventory_hostname].linux_freeipa_enroll_manage_hostname is defined)
          )
          else (
            hostvars['localhost'].linux_freeipa_enroll_manage_hostname
            if (
              ('localhost' in hostvars)
              and (hostvars['localhost'].linux_freeipa_enroll_manage_hostname is defined)
            )
            else linux_freeipa_enroll_manage_hostname
          )
        ) | bool
      }}
    linux_ipa_effective_pin_local_hostname_in_etc_hosts: >-
      {{
        (
          hostvars[inventory_hostname].linux_freeipa_enroll_pin_local_hostname_in_etc_hosts
          if (
            (inventory_hostname in hostvars)
            and (hostvars[inventory_hostname].linux_freeipa_enroll_pin_local_hostname_in_etc_hosts is defined)
          )
          else (
            hostvars['localhost'].linux_freeipa_enroll_pin_local_hostname_in_etc_hosts
            if (
              ('localhost' in hostvars)
              and (hostvars['localhost'].linux_freeipa_enroll_pin_local_hostname_in_etc_hosts is defined)
            )
            else linux_freeipa_enroll_pin_local_hostname_in_etc_hosts
          )
        ) | bool
      }}
    linux_ipa_effective_hostname: >-
      {% set ns = namespace(result='') %}
      {% set candidates = [] %}
      {% set requested = linux_ipa_requested_hostname | default('') | trim | lower %}
      {% set requested_source = linux_ipa_requested_hostname_source | default(('explicit' if requested | length > 0 else ''), true) | trim | lower %}
      {% set requested_is_proxmox_hint = requested_source in ['proxmox_vm_name_fqdn', 'proxmox_vm_name_completed_with_suffix'] %}
      {% set current_fqdn = linux_ipa_current_fqdn.stdout | default('') | trim | lower %}
      {% set current_short = linux_ipa_current_short_hostname.stdout | default('') | trim | lower %}
      {% set inventory_name = inventory_hostname | trim | lower %}
      {% if requested | length > 0 and not requested_is_proxmox_hint %}
      {%   set _ = candidates.append(requested) %}
      {% endif %}
      {% if requested | length > 0
            and not requested_is_proxmox_hint
            and '.' not in requested
            and linux_ipa_identity_hostname_suffix | default('') | trim | length > 0 %}
      {%   set _ = candidates.append(requested ~ '.' ~ (linux_ipa_identity_hostname_suffix | trim | lower)) %}
      {% endif %}
      {% if current_fqdn | length > 0 %}
      {%   set _ = candidates.append(current_fqdn) %}
      {% endif %}
      {% if requested | length > 0 and requested_is_proxmox_hint %}
      {%   set _ = candidates.append(requested) %}
      {% endif %}
      {% if requested | length > 0
            and requested_is_proxmox_hint
            and '.' not in requested
            and linux_ipa_identity_hostname_suffix | default('') | trim | length > 0 %}
      {%   set _ = candidates.append(requested ~ '.' ~ (linux_ipa_identity_hostname_suffix | trim | lower)) %}
      {% endif %}
      {% if inventory_name | length > 0 %}
      {%   set _ = candidates.append(inventory_name) %}
      {% endif %}
      {% if current_short | length > 0
            and '.' not in current_short
            and linux_ipa_identity_hostname_suffix | default('') | trim | length > 0 %}
      {%   set _ = candidates.append(current_short ~ '.' ~ (linux_ipa_identity_hostname_suffix | trim | lower)) %}
      {% endif %}
      {% if linux_ipa_identity_allow_domain_completion | bool
            and current_short | length > 0
            and '.' not in current_short
            and ipaclient_domain | length > 0 %}
      {%   set _ = candidates.append(current_short ~ '.' ~ (ipaclient_domain | lower)) %}
      {% endif %}
      {% for candidate in candidates %}
      {%   if ns.result == ''
            and candidate is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$')
            and not (candidate is match('^[0-9.]+$')) %}
      {%     set ns.result = candidate %}
      {%   endif %}
      {% endfor %}
      {{ ns.result }}
    linux_ipa_current_fqdn_normalized: "{{ linux_ipa_current_fqdn.stdout | default('') | trim | lower }}"
    linux_ipa_current_short_hostname_normalized: "{{ linux_ipa_current_short_hostname.stdout | default('') | trim | lower }}"
    linux_ipa_primary_ipv4: >-
      {{
        ansible_facts.get('default_ipv4', {}).get('address', '')
        | string
        | trim
      }}
  changed_when: false

- name: Repair a placeholder Linux guest system hostname before later FreeIPA steps
  ansible.builtin.command:
    argv:
      - hostnamectl
      - set-hostname
      - "{{ linux_ipa_effective_hostname }}"
  register: linux_ipa_early_hostname_repair
  become: true
  changed_when: linux_ipa_current_fqdn_normalized != linux_ipa_effective_hostname
  when:
    - linux_ipa_effective_manage_hostname | bool
    - not ansible_check_mode
    - linux_ipa_effective_hostname | length > 0
    - linux_ipa_effective_hostname is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$')
    - not (linux_ipa_effective_hostname is match('^[0-9.]+$'))
    - linux_ipa_current_fqdn_normalized in ['localhost', 'localhost.localdomain', linux_ipa_current_short_hostname_normalized]

- name: Pin the resolved Linux guest hostname to the guest primary IPv4 before enrollment
  ansible.builtin.blockinfile:
    path: /etc/hosts
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: FreeIPA local hostname pin"
    block: |
      {{ linux_ipa_primary_ipv4 }} {{ linux_ipa_effective_hostname }}{% if (linux_ipa_effective_hostname | regex_replace('\\..*$', '')) != linux_ipa_effective_hostname %} {{ linux_ipa_effective_hostname | regex_replace('\\..*$', '') }}{% endif %}
  become: true
  when:
    - linux_ipa_effective_pin_local_hostname_in_etc_hosts | bool
    - linux_ipa_primary_ipv4 | length > 0
    - linux_ipa_effective_hostname | length > 0
    - linux_ipa_effective_hostname is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$')
    - not (linux_ipa_effective_hostname is match('^[0-9.]+$'))

- name: Re-read the current host FQDN after early hostname repair
  ansible.builtin.command: hostname -f
  register: linux_ipa_current_fqdn
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - linux_ipa_effective_manage_hostname | bool
    - not ansible_check_mode

- name: Assert the Linux client resolves to a final FQDN
  ansible.builtin.assert:
    that:
      - linux_ipa_effective_hostname | length > 0
    fail_msg: >-
      Could not determine a final FQDN for {{ inventory_hostname }}.
      Use a real FQDN inventory name, set ipa_hostname in linux_ipa_client_hosts,
      or ensure hostname -f returns the final hostname on the guest.

- name: Publish the resolved FreeIPA hostgroup hostname
  ansible.builtin.set_fact:
    freeipa_hostgroup_hostname: "{{ linux_ipa_effective_hostname }}"
