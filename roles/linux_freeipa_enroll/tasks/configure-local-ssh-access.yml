---
- name: Build the effective Linux SSH allow-user list
  vars:
    linux_freeipa_enroll_local_sshd_connection_user: >-
      {{
        ansible_user
        | default(ansible_ssh_user | default('', true), true)
        | string
        | trim
      }}
    linux_freeipa_enroll_local_sshd_user_bases: >-
      {{
        (
          linux_freeipa_enroll_local_sudo_users_effective | default([])
          | map('string')
          | map('trim')
          | reject('equalto', '')
          | map('regex_replace', '@.*$', '')
          | reject('equalto', '')
          | unique
          | list
        )
      }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_local_sshd_allow_user_candidates: >-
      {{
        (
          linux_freeipa_enroll_local_sshd_user_bases
          +
          (
            (
              linux_freeipa_enroll_local_sshd_user_bases
              | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_domain | string | trim | lower))
              | list
            )
            if (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
            else []
          )
          +
          (
            (
              linux_freeipa_enroll_local_sshd_user_bases
              | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_realm | string | trim | upper))
              | list
            )
            if (
              (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
              and
              (
                (linux_freeipa_enroll_effective_realm | string | trim | upper)
                !=
                (linux_freeipa_enroll_effective_domain | string | trim | lower)
              )
            )
            else []
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | sort
        | list
      }}
  changed_when: false

- name: Resolve guest-visible Linux SSH allow-user names
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item }}"
  loop: "{{ linux_freeipa_enroll_local_sshd_allow_user_candidates | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: linux_freeipa_enroll_local_sshd_allow_user_resolution
  changed_when: false
  failed_when: false
  when: linux_freeipa_enroll_local_sshd_allow_user_candidates | default([]) | length > 0

- name: Finalize the effective Linux SSH allow-user list
  vars:
    linux_freeipa_enroll_local_sshd_connection_user: >-
      {{
        ansible_user
        | default(ansible_ssh_user | default('', true), true)
        | string
        | trim
      }}
    linux_freeipa_enroll_local_sshd_resolved_users: >-
      {{
        (
          linux_freeipa_enroll_local_sshd_allow_user_resolution.results
          | default([])
          | selectattr('rc', 'equalto', 0)
          | map(attribute='item')
          | list
        )
      }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_local_sshd_allow_users_effective: >-
      {{
        (
          (
            linux_freeipa_enroll_local_sshd_resolved_users
            if (linux_freeipa_enroll_local_sshd_resolved_users | length > 0)
            else (linux_freeipa_enroll_local_sshd_allow_user_candidates | default([]))
          )
          +
          (linux_freeipa_enroll_local_sshd_allow_users_extra | default([]))
          +
          (
            [linux_freeipa_enroll_local_sshd_connection_user]
            if (linux_freeipa_enroll_local_sshd_connection_user | length > 0)
            else []
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | sort
        | list
      }}
  changed_when: false

- name: Configure local SSH access allowlist for Linux IPA admin users
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED BLOCK: linux_freeipa_enroll access"
    block: |
      AllowUsers {{ linux_freeipa_enroll_local_sshd_allow_users_effective | join(' ') }}
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH daemon for Linux access changes

- name: Flush Linux SSH access handlers
  ansible.builtin.meta: flush_handlers
