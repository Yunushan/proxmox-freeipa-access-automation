---
- name: Build the effective Linux SSH allow-user list
  vars:
    linux_freeipa_enroll_local_sshd_connection_user: >-
      {{
        ansible_user
        | default(ansible_ssh_user | default('', true), true)
        | string
        | trim
      }}
    linux_freeipa_enroll_local_sshd_user_bases: >-
      {{
        (
          linux_freeipa_enroll_local_sudo_users_effective | default([])
          | map('string')
          | map('trim')
          | reject('equalto', '')
          | map('regex_replace', '@.*$', '')
          | reject('equalto', '')
          | unique
          | list
        )
      }}
    linux_freeipa_enroll_local_sshd_domain_variants: >-
      {{
        (
          linux_freeipa_enroll_local_sshd_user_bases
          | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_domain | string | trim | lower))
          | list
        )
        if (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
        else []
      }}
    linux_freeipa_enroll_local_sshd_realm_variants: >-
      {{
        (
          linux_freeipa_enroll_local_sshd_user_bases
          | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_realm | string | trim | upper))
          | list
        )
        if (
          (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
          and
          (
            (linux_freeipa_enroll_effective_realm | string | trim | upper)
            !=
            (linux_freeipa_enroll_effective_domain | string | trim | lower)
          )
        )
        else []
      }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_local_sshd_allow_user_candidates: >-
      {{
        (
          linux_freeipa_enroll_local_sshd_user_bases
          + linux_freeipa_enroll_local_sshd_domain_variants
          + linux_freeipa_enroll_local_sshd_realm_variants
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | sort
        | list
      }}
    linux_freeipa_enroll_local_sshd_connection_user_effective: >-
      {{
        [linux_freeipa_enroll_local_sshd_connection_user]
        if (linux_freeipa_enroll_local_sshd_connection_user | length > 0)
        else []
      }}
  changed_when: false

- name: Normalize the extra Linux SSH allow-user list
  ansible.builtin.set_fact:
    linux_freeipa_enroll_local_sshd_extra_users_effective: >-
      {{
        (
          linux_freeipa_enroll_local_sshd_allow_users_extra
          if (
            linux_freeipa_enroll_local_sshd_allow_users_extra is sequence
            and linux_freeipa_enroll_local_sshd_allow_users_extra is not string
          )
          else [linux_freeipa_enroll_local_sshd_allow_users_extra]
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  changed_when: false

- name: Finalize the effective Linux SSH allow-user list
  vars:
    linux_freeipa_enroll_local_sshd_candidate_users: >-
      {{ linux_freeipa_enroll_local_sshd_allow_user_candidates | default([]) }}
    linux_freeipa_enroll_local_sshd_extra_users: >-
      {{ linux_freeipa_enroll_local_sshd_extra_users_effective | default([]) }}
    linux_freeipa_enroll_local_sshd_connection_users: >-
      {{ linux_freeipa_enroll_local_sshd_connection_user_effective | default([]) }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_local_sshd_allow_users_effective: >-
      {{
        (
          linux_freeipa_enroll_local_sshd_candidate_users
          + linux_freeipa_enroll_local_sshd_extra_users
          + linux_freeipa_enroll_local_sshd_connection_users
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | sort
        | list
      }}
  changed_when: false

- name: Configure local SSH access allowlist for Linux IPA admin users
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED BLOCK: linux_freeipa_enroll access"
    block: |
      AllowUsers {{ linux_freeipa_enroll_local_sshd_allow_users_effective | join(' ') }}
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH daemon for Linux access changes

- name: Flush Linux SSH access handlers
  ansible.builtin.meta: flush_handlers
