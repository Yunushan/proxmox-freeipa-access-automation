---
- name: Validate Linux IPA enrollment inputs
  vars:
    linux_freeipa_enroll_inventory_server_fallback_count: >-
      {{
        (
          groups['ipa_servers']
          | default([])
          | map('string')
          | map('trim')
          | reject('equalto', '')
          | list
          | length
        )
        if (linux_freeipa_enroll_merge_inventory_ipa_servers | bool)
        else 0
      }}
  ansible.builtin.assert:
    that:
      - ipaclient_domain | length > 0
      - ipaclient_realm | length > 0
      - linux_ipaadmin_principal | length > 0
      - linux_ipaadmin_password | length > 0
      - >-
        (
          (linux_ipa_servers | length > 0)
          or (linux_freeipa_enroll_inventory_server_fallback_count | int > 0)
          or not (linux_ipaclient_no_dns_lookup | bool)
        )
    fail_msg: Required Linux FreeIPA enrollment variables are missing.

- name: Prepare effective Linux IPA enrollment variables
  ansible.builtin.set_fact:
    linux_freeipa_enroll_effective_ipaadmin_principal: "{{ linux_ipaadmin_principal }}"
    linux_freeipa_enroll_effective_ipaadmin_password: "{{ linux_ipaadmin_password }}"
    linux_freeipa_enroll_effective_domain: "{{ ipaclient_domain }}"
    linux_freeipa_enroll_effective_realm: "{{ ipaclient_realm }}"
    linux_freeipa_enroll_effective_servers: "{{ linux_ipa_servers }}"
    linux_freeipa_enroll_effective_inventory_servers: >-
      {{
        groups['ipa_servers'] | default([])
        if (linux_freeipa_enroll_merge_inventory_ipa_servers | bool)
        else []
      }}
    linux_freeipa_enroll_effective_mkhomedir: "{{ linux_ipaclient_mkhomedir }}"
    linux_freeipa_enroll_effective_force_join: "{{ linux_ipaclient_force_join }}"
    linux_freeipa_enroll_effective_no_dns_lookup: "{{ linux_ipaclient_no_dns_lookup }}"
    linux_freeipa_enroll_effective_no_sudo: "{{ linux_ipaclient_no_sudo }}"
    linux_freeipa_enroll_effective_permit: "{{ linux_ipasssd_permit }}"
    linux_freeipa_enroll_effective_install_packages: "{{ linux_ipaclient_install_packages }}"
    linux_freeipa_enroll_effective_configure_dns_resolver: "{{ linux_ipaclient_configure_dns_resolver }}"
    linux_freeipa_enroll_effective_dns_servers: "{{ linux_ipaclient_dns_servers }}"
    linux_freeipa_enroll_effective_manage_etc_hosts: "{{ linux_ipa_manage_etc_hosts }}"
    linux_freeipa_enroll_effective_etc_hosts_entries: "{{ linux_ipa_etc_hosts_entries }}"
  changed_when: false
  no_log: true

- name: Normalize Linux IPA enrollment server inputs
  ansible.builtin.set_fact:
    linux_freeipa_enroll_effective_domain_normalized: >-
      {{
        linux_freeipa_enroll_effective_domain
        | default('', true)
        | string
        | trim
        | lower
      }}
    linux_freeipa_enroll_effective_servers_normalized: >-
      {{
        (
          (
            linux_freeipa_enroll_effective_servers
            if (linux_freeipa_enroll_effective_servers is sequence and linux_freeipa_enroll_effective_servers is not string)
            else (
              linux_freeipa_enroll_effective_servers
              | default('', true)
              | string
              | split(',')
            )
          )
          +
          (
            linux_freeipa_enroll_effective_inventory_servers
            if (linux_freeipa_enroll_effective_inventory_servers is sequence and linux_freeipa_enroll_effective_inventory_servers is not string)
            else (
              linux_freeipa_enroll_effective_inventory_servers
              | default('', true)
              | string
              | split(',')
            )
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | map('lower')
        | unique
        | list
      }}
  changed_when: false
  no_log: true

- name: Validate Linux IPA /etc/hosts bootstrap entries
  vars:
    linux_freeipa_enroll_entry_names: >-
      {{
        (
          item.names
          if (item.names is sequence and item.names is not string)
          else (
            item.names
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  ansible.builtin.assert:
    that:
      - item.ip | default('', true) | string | trim | length > 0
      - linux_freeipa_enroll_entry_names | length > 0
    fail_msg: >-
      Each linux_ipa_etc_hosts_entries item must define a non-empty ip and at least one hostname under names.
      Invalid entry: {{ item | to_nice_yaml(indent=2) | trim }}
  loop: "{{ linux_freeipa_enroll_effective_etc_hosts_entries }}"
  loop_control:
    label: "{{ item.ip | default('missing-ip') }}"
  when: linux_freeipa_enroll_effective_manage_etc_hosts | bool

- name: Build Linux IPA /etc/hosts bootstrap lines
  vars:
    linux_freeipa_enroll_etc_hosts_lines_yaml: |
      {% set lines = [] %}
      {% for entry in linux_freeipa_enroll_effective_etc_hosts_entries %}
      {%   set entry_names = (
             entry.names
             if (entry.names is sequence and entry.names is not string)
             else (
               entry.names
               | default('', true)
               | string
               | split(',')
             )
           )
           | map('string')
           | map('trim')
           | reject('equalto', '')
           | list %}
      {%   if (entry.ip | default('', true) | string | trim | length > 0) and (entry_names | length > 0) %}
      {%     set _ = lines.append((entry.ip | string | trim) ~ ' ' ~ (entry_names | join(' '))) %}
      {%   endif %}
      {% endfor %}
      {{ lines | to_yaml }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_etc_hosts_lines: "{{ linux_freeipa_enroll_etc_hosts_lines_yaml | from_yaml }}"
  changed_when: false
  when: linux_freeipa_enroll_effective_manage_etc_hosts | bool

- name: Ensure Linux IPA /etc/hosts bootstrap entries are present
  ansible.builtin.blockinfile:
    path: /etc/hosts
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: FreeIPA bootstrap entries"
    block: |
      {% for line in linux_freeipa_enroll_etc_hosts_lines %}
      {{ line }}
      {% endfor %}
  when:
    - linux_freeipa_enroll_effective_manage_etc_hosts | bool
    - linux_freeipa_enroll_etc_hosts_lines | default([]) | length > 0

- name: Assert Linux IPA domain is not configured as an IPA server hostname
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_effective_domain_normalized not in linux_freeipa_enroll_effective_servers_normalized
    fail_msg: >-
      ipaclient_domain must be the shared IPA DNS domain, not an IPA server hostname.
      For example, use example.com for ipaclient_domain and ipa01.example.com under linux_ipa_servers.
      Current values are ipaclient_domain={{ linux_freeipa_enroll_effective_domain_normalized }} and
      linux_ipa_servers={{ linux_freeipa_enroll_effective_servers_normalized | join(', ') }}.
  when: linux_freeipa_enroll_effective_servers_normalized | length > 0

- name: Resolve configured IPA servers from the Linux guest
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ item }}"
  register: linux_freeipa_enroll_server_resolution
  loop: "{{ linux_freeipa_enroll_effective_servers_normalized }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - linux_freeipa_enroll_effective_servers_normalized | length > 0
    - not (linux_freeipa_enroll_effective_configure_dns_resolver | bool)

- name: Assert configured IPA servers resolve from the Linux guest
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | default('') | trim | length > 0
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot resolve the configured IPA server {{ item.item }}.
      Verify DNS or /etc/hosts on the guest, and verify ipaclient_domain is the shared IPA DNS domain
      rather than a server hostname.
  loop: "{{ linux_freeipa_enroll_server_resolution.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (linux_freeipa_enroll_effective_configure_dns_resolver | bool)

- name: Check LDAP reachability to configured IPA servers from the Linux guest
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 389
    timeout: 5
    connect_timeout: 3
    state: started
  register: linux_freeipa_enroll_ldap_connectivity
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ linux_freeipa_enroll_effective_servers_normalized }}"
  loop_control:
    label: "{{ item }}"

- name: Assert LDAP reachability to configured IPA servers from the Linux guest
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false))
      - item.elapsed is defined
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot reach LDAP on {{ item.item }}:389.
      FreeIPA client discovery needs TCP 389 to the IPA server. Verify firewall, routing, and that
      the configured target is a real IPA server.
  loop: "{{ linux_freeipa_enroll_ldap_connectivity.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check HTTPS reachability to configured IPA servers from the Linux guest
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 443
    timeout: 5
    connect_timeout: 3
    state: started
  register: linux_freeipa_enroll_https_connectivity
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ linux_freeipa_enroll_effective_servers_normalized }}"
  loop_control:
    label: "{{ item }}"

- name: Assert HTTPS reachability to configured IPA servers from the Linux guest
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false))
      - item.elapsed is defined
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot reach HTTPS on {{ item.item }}:443.
      FreeIPA enrollment also needs the IPA web/API endpoint. Verify firewall, routing, and that
      the configured target is a real IPA server.
  loop: "{{ linux_freeipa_enroll_https_connectivity.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read current Linux guest FQDN before IPA enrollment
  ansible.builtin.command: hostname -f
  register: linux_freeipa_enroll_current_fqdn
  check_mode: false
  changed_when: false
  failed_when: false

- name: Read current Linux guest short hostname before IPA enrollment
  ansible.builtin.command: hostname -s
  register: linux_freeipa_enroll_current_short_hostname
  check_mode: false
  changed_when: false
  failed_when: false

- name: Prepare Linux guest hostname candidates for IPA enrollment
  ansible.builtin.set_fact:
    linux_freeipa_enroll_target_hostname: >-
      {{
        freeipa_hostgroup_hostname
        | default(linux_ipa_effective_hostname, true)
        | default('', true)
        | string
        | trim
        | lower
      }}
    linux_freeipa_enroll_current_fqdn_normalized: >-
      {{
        linux_freeipa_enroll_current_fqdn.stdout
        | default('', true)
        | string
        | trim
        | lower
      }}
  changed_when: false

- name: Update Linux guest system hostname from the resolved IPA hostname
  ansible.builtin.command:
    argv:
      - hostnamectl
      - set-hostname
      - "{{ linux_freeipa_enroll_target_hostname }}"
  when:
    - linux_freeipa_enroll_manage_hostname | bool
    - not ansible_check_mode
    - linux_freeipa_enroll_target_hostname is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$')
    - not (linux_freeipa_enroll_target_hostname is match('^[0-9.]+$'))
    - linux_freeipa_enroll_current_fqdn_normalized in ['localhost', 'localhost.localdomain', linux_freeipa_enroll_current_short_hostname.stdout | default('', true) | string | trim | lower]
  changed_when: true

- name: Re-read Linux guest FQDN after hostname management
  ansible.builtin.command: hostname -f
  register: linux_freeipa_enroll_current_fqdn
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - linux_freeipa_enroll_manage_hostname | bool
    - not ansible_check_mode

- name: Assert the Linux guest has a valid system hostname for IPA enrollment
  ansible.builtin.assert:
    that:
      - >-
        (
          linux_freeipa_enroll_current_fqdn.stdout | default('') | trim | lower not in ['localhost', 'localhost.localdomain']
          and
          (linux_freeipa_enroll_current_fqdn.stdout | default('') | trim | lower is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$'))
          and
          not ((linux_freeipa_enroll_current_fqdn.stdout | default('') | trim | lower) is match('^[0-9.]+$'))
        )
        or
        (
          ansible_check_mode
          and
          linux_freeipa_enroll_manage_hostname | bool
          and linux_freeipa_enroll_target_hostname is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$')
          and not (linux_freeipa_enroll_target_hostname is match('^[0-9.]+$'))
        )
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot be enrolled into FreeIPA because its current system hostname is
      {{ linux_freeipa_enroll_current_fqdn.stdout | default('unset') | trim | default('unset', true) }}.
      {% if linux_freeipa_enroll_target_hostname | length > 0 %}
      The resolved target hostname for this guest is {{ linux_freeipa_enroll_target_hostname }}.
      {% endif %}
      Set a real FQDN on the guest first, or enable linux_freeipa_enroll_manage_hostname and provide a resolvable
      FQDN through ipa_hostname, linux_ipa_identity_hostname_suffix, or the guest's own hostname configuration.

- name: Resolve the Linux guest hostname that will be enrolled
  ansible.builtin.set_fact:
    linux_freeipa_enroll_hostname_to_verify: >-
      {{
        (
          linux_freeipa_enroll_target_hostname
          if (linux_freeipa_enroll_target_hostname | length > 0)
          else (
            linux_freeipa_enroll_current_fqdn.stdout
            | default('', true)
            | string
            | trim
            | lower
          )
        )
      }}
  changed_when: false

- name: Resolve the Linux guest enrollment hostname locally on the guest
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ linux_freeipa_enroll_hostname_to_verify }}"
  register: linux_freeipa_enroll_hostname_resolution
  changed_when: false
  failed_when: false
  check_mode: false

- name: Normalize resolved addresses for the Linux guest enrollment hostname
  ansible.builtin.set_fact:
    linux_freeipa_enroll_hostname_resolved_addresses: >-
      {{
        linux_freeipa_enroll_hostname_resolution.stdout_lines
        | default([])
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | map('regex_replace', '\\s+.*$', '')
        | list
      }}
  changed_when: false

- name: Assert the Linux guest enrollment hostname resolves to usable non-link-local addresses
  vars:
    linux_freeipa_enroll_hostname_bad_resolution_pattern: '^(127\\.|::1$|169\\.254\\.|fe[89ab][0-9a-f]:)'
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_hostname_resolution.rc == 0
      - linux_freeipa_enroll_hostname_resolution.stdout | default('') | trim | length > 0
      - linux_freeipa_enroll_hostname_resolved_addresses | length > 0
      - >-
        (
          linux_freeipa_enroll_hostname_resolved_addresses
          | select('match', linux_freeipa_enroll_hostname_bad_resolution_pattern)
          | list
          | length
        ) == 0
    fail_msg: >-
      Linux guest {{ inventory_hostname }} resolves its enrollment hostname {{ linux_freeipa_enroll_hostname_to_verify }}
      to {{ linux_freeipa_enroll_hostname_resolved_addresses | default([]) | join(', ') | default('an unresolved value', true) }}.
      The guest hostname must not resolve to loopback or link-local addresses such as 127.0.0.1, ::1,
      169.254.0.0/16, or fe80::/10. Fix DNS or /etc/hosts on the guest before IPA enrollment.

- name: Prepare the Linux guest primary IPv4 address for reverse DNS verification
  ansible.builtin.set_fact:
    linux_freeipa_enroll_primary_ipv4_to_verify: "{{ ansible_default_ipv4.address | default('', true) | string | trim }}"
  changed_when: false

- name: Resolve the Linux guest primary IPv4 address back to a hostname
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ linux_freeipa_enroll_primary_ipv4_to_verify }}"
  register: linux_freeipa_enroll_primary_ipv4_reverse_resolution
  changed_when: false
  failed_when: false
  check_mode: false
  when: linux_freeipa_enroll_primary_ipv4_to_verify | length > 0

- name: Normalize reverse DNS names for the Linux guest primary IPv4 address
  ansible.builtin.set_fact:
    linux_freeipa_enroll_primary_ipv4_reverse_names: >-
      {{
        (
          linux_freeipa_enroll_primary_ipv4_reverse_resolution.stdout
          | default('', true)
          | string
          | trim
          | split()
        )[1:]
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | map('lower')
        | list
      }}
  changed_when: false
  when: linux_freeipa_enroll_primary_ipv4_to_verify | length > 0

- name: Assert the Linux guest primary IPv4 reverse DNS matches the enrollment hostname
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_primary_ipv4_reverse_resolution.rc == 0
      - linux_freeipa_enroll_primary_ipv4_reverse_resolution.stdout | default('') | trim | length > 0
      - linux_freeipa_enroll_primary_ipv4_reverse_names | length > 0
      - linux_freeipa_enroll_hostname_to_verify in linux_freeipa_enroll_primary_ipv4_reverse_names
    fail_msg: >-
      Linux guest {{ inventory_hostname }} has primary IPv4 address {{ linux_freeipa_enroll_primary_ipv4_to_verify }}
      but reverse DNS resolves it to
      {{ linux_freeipa_enroll_primary_ipv4_reverse_names | default([]) | join(', ') | default('an unresolved value', true) }}
      instead of {{ linux_freeipa_enroll_hostname_to_verify }}.
      Fix the PTR record so the guest primary IP maps back to the same FQDN used for IPA enrollment.
  when: linux_freeipa_enroll_primary_ipv4_to_verify | length > 0

- name: Skip Linux IPA enrollment in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode skips the upstream FreeIPA ipaclient enrollment role in this repository.
      Use validate.yml plus a real linux-clients or site run to verify actual Linux IPA enrollment.
  when: ansible_check_mode
  changed_when: false

- name: Initialize Linux IPA enrollment join state
  ansible.builtin.set_fact:
    linux_freeipa_enroll_join_succeeded: false
    linux_freeipa_enroll_join_last_error: ""
    linux_freeipa_enroll_join_last_error_is_timeout: false
    linux_freeipa_enroll_join_last_server: ""
    linux_freeipa_enroll_join_server_candidates: >-
      {{
        linux_freeipa_enroll_effective_servers_normalized
        if (linux_freeipa_enroll_effective_servers_normalized | length > 0)
        else ['__auto__']
      }}
  when: not ansible_check_mode

- name: Retry Linux host enrollment into FreeIPA across the effective IPA server candidates
  ansible.builtin.include_tasks: join-attempt.yml
  loop: "{{ range(1, (linux_freeipa_enroll_join_attempts | int) + 1) | product(linux_freeipa_enroll_join_server_candidates) | list }}"
  loop_control:
    loop_var: linux_freeipa_enroll_join_plan_item
    label: >-
      attempt {{ linux_freeipa_enroll_join_plan_item.0 }} ->
      {{
        'auto-discovery'
        if (linux_freeipa_enroll_join_plan_item.1 == '__auto__')
        else linux_freeipa_enroll_join_plan_item.1
      }}
  vars:
    linux_freeipa_enroll_join_attempt: "{{ linux_freeipa_enroll_join_plan_item.0 }}"
    linux_freeipa_enroll_join_candidate_server: "{{ linux_freeipa_enroll_join_plan_item.1 }}"
    linux_freeipa_enroll_join_candidate_is_last_for_attempt: >-
      {{
        (
          linux_freeipa_enroll_join_plan_item.1
          == (linux_freeipa_enroll_join_server_candidates | last)
        ) | bool
      }}
  when:
    - not ansible_check_mode
    - not (linux_freeipa_enroll_join_succeeded | bool)

- name: Assert Linux IPA enrollment completed successfully
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_join_succeeded | bool
    fail_msg: >-
      Linux IPA enrollment did not complete successfully for {{ inventory_hostname }}.
      Last server candidate: {{ linux_freeipa_enroll_join_last_server | default('unknown', true) }}.
      Last error: {{ linux_freeipa_enroll_join_last_error | default('unknown error') }}
  when: not ansible_check_mode

- name: Mark Linux guest as successfully enrolled for later FreeIPA hostgroup updates
  ansible.builtin.add_host:
    name: "{{ inventory_hostname }}"
    groups: "{{ linux_freeipa_enroll_success_group }}"
    freeipa_hostgroup_hostname: "{{ freeipa_hostgroup_hostname | default(omit) }}"
    ipa_hostname: "{{ ipa_hostname | default(omit) }}"
  delegate_to: localhost
  changed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_join_succeeded | bool
