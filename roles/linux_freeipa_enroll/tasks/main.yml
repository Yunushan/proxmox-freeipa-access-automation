---
- name: Validate Linux IPA enrollment inputs
  vars:
    linux_freeipa_enroll_inventory_server_fallback_count: >-
      {{
        (
          groups['ipa_servers']
          | default([])
          | map('string')
          | map('trim')
          | reject('equalto', '')
          | list
          | length
        )
        if (linux_freeipa_enroll_merge_inventory_ipa_servers | bool)
        else 0
      }}
  ansible.builtin.assert:
    that:
      - ipaclient_domain | length > 0
      - ipaclient_realm | length > 0
      - linux_ipaadmin_principal | length > 0
      - linux_ipaadmin_password | length > 0
      - linux_freeipa_enroll_https_port | int > 0
      - linux_freeipa_enroll_https_port | int < 65536
      - >-
        (
          linux_freeipa_enroll_networkmanager_dns_refresh_strategy
          | default('', true)
          | string
          | trim
          | lower
        ) in ['', 'apply', 'restart', 'none']
      - >-
        (
          (linux_ipa_servers | length > 0)
          or (linux_freeipa_enroll_inventory_server_fallback_count | int > 0)
          or not (linux_ipaclient_no_dns_lookup | bool)
        )
    fail_msg: Required Linux FreeIPA enrollment variables are missing.

- name: Prepare effective Linux IPA enrollment variables
  ansible.builtin.set_fact:
    linux_freeipa_enroll_effective_ipaadmin_principal: "{{ linux_ipaadmin_principal }}"
    linux_freeipa_enroll_effective_ipaadmin_password: "{{ linux_ipaadmin_password }}"
    linux_freeipa_enroll_effective_domain: "{{ ipaclient_domain }}"
    linux_freeipa_enroll_effective_realm: "{{ ipaclient_realm }}"
    linux_freeipa_enroll_effective_servers: "{{ linux_ipa_servers }}"
    linux_freeipa_enroll_effective_https_port: "{{ linux_freeipa_enroll_https_port | int }}"
    linux_freeipa_enroll_effective_inventory_servers: >-
      {{
        groups['ipa_servers'] | default([])
        if (linux_freeipa_enroll_merge_inventory_ipa_servers | bool)
        else []
      }}
    linux_freeipa_enroll_effective_mkhomedir: "{{ linux_ipaclient_mkhomedir }}"
    linux_freeipa_enroll_effective_force_join: "{{ linux_ipaclient_force_join }}"
    linux_freeipa_enroll_requested_no_dns_lookup: "{{ linux_ipaclient_no_dns_lookup }}"
    linux_freeipa_enroll_effective_no_sudo: "{{ linux_ipaclient_no_sudo }}"
    linux_freeipa_enroll_effective_permit: "{{ linux_ipasssd_permit }}"
    linux_freeipa_enroll_effective_manage_authoritative_dns: "{{ linux_freeipa_enroll_manage_authoritative_dns }}"
    linux_freeipa_enroll_effective_authoritative_dns_delegate_host: "{{ linux_freeipa_enroll_authoritative_dns_delegate_host }}"
    linux_freeipa_enroll_effective_authoritative_dns_query_server: "{{ linux_freeipa_enroll_authoritative_dns_query_server }}"
    linux_freeipa_enroll_effective_authoritative_dns_remove_link_local_aaaa: "{{ linux_freeipa_enroll_authoritative_dns_remove_link_local_aaaa }}"
    linux_freeipa_enroll_effective_install_packages: "{{ linux_ipaclient_install_packages }}"
    linux_freeipa_enroll_effective_configure_dns_resolver: "{{ linux_ipaclient_configure_dns_resolver }}"
    linux_freeipa_enroll_effective_dns_servers: "{{ linux_ipaclient_dns_servers }}"
    linux_freeipa_enroll_effective_manage_etc_hosts: "{{ linux_ipa_manage_etc_hosts }}"
    linux_freeipa_enroll_effective_etc_hosts_entries: "{{ linux_ipa_etc_hosts_entries }}"
    linux_freeipa_enroll_effective_networkmanager_dns_refresh_strategy: >-
      {% set requested = (
           linux_freeipa_enroll_networkmanager_dns_refresh_strategy
           | default('', true)
           | string
           | trim
           | lower
         ) %}
      {% if requested in ['apply', 'restart', 'none'] %}
      {{ requested }}
      {% elif linux_freeipa_enroll_restart_networkmanager_after_dns_config is defined %}
      {{ 'restart' if (linux_freeipa_enroll_restart_networkmanager_after_dns_config | bool) else 'none' }}
      {% else %}
      apply
      {% endif %}
  changed_when: false
  no_log: true

- name: Normalize Linux IPA enrollment server inputs
  ansible.builtin.set_fact:
    linux_freeipa_enroll_effective_domain_normalized: >-
      {{
        linux_freeipa_enroll_effective_domain
        | default('', true)
        | string
        | trim
        | lower
      }}
    linux_freeipa_enroll_effective_servers_normalized: >-
      {{
        (
          (
            linux_freeipa_enroll_effective_servers
            if (linux_freeipa_enroll_effective_servers is sequence and linux_freeipa_enroll_effective_servers is not string)
            else (
              linux_freeipa_enroll_effective_servers
              | default('', true)
              | string
              | split(',')
            )
          )
          +
          (
            linux_freeipa_enroll_effective_inventory_servers
            if (linux_freeipa_enroll_effective_inventory_servers is sequence and linux_freeipa_enroll_effective_inventory_servers is not string)
            else (
              linux_freeipa_enroll_effective_inventory_servers
              | default('', true)
              | string
              | split(',')
            )
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | map('lower')
        | unique
        | list
      }}
  changed_when: false
  no_log: true

- name: Derive deterministic Linux IPA enrollment join behavior
  ansible.builtin.set_fact:
    linux_freeipa_enroll_effective_no_dns_lookup: >-
      {{
        (
          (linux_freeipa_enroll_effective_servers_normalized | length > 0)
          and (linux_freeipa_enroll_force_no_dns_lookup_with_explicit_servers | bool)
        )
        or
        (linux_freeipa_enroll_requested_no_dns_lookup | bool)
      }}
    linux_freeipa_enroll_effective_no_proxy_entries: >-
      {{
        (
          linux_freeipa_enroll_effective_servers_normalized
          + [
            linux_freeipa_enroll_effective_domain_normalized,
            '.' ~ linux_freeipa_enroll_effective_domain_normalized,
            'localhost',
            '127.0.0.1',
            '::1'
          ]
        )
        | reject('equalto', '')
        | unique
        | list
      }}
    linux_freeipa_enroll_effective_https_port_suffix: >-
      {{
        ''
        if (linux_freeipa_enroll_effective_https_port | int) == 443
        else ':' ~ (linux_freeipa_enroll_effective_https_port | string)
      }}
  changed_when: false
  no_log: true

- name: Build Linux IPA enrollment join environment overrides
  ansible.builtin.set_fact:
    linux_freeipa_enroll_effective_join_environment: >-
      {{
        {
          'no_proxy': (
            linux_freeipa_enroll_effective_no_proxy_entries
            | join(',')
          ),
          'NO_PROXY': (
            linux_freeipa_enroll_effective_no_proxy_entries
            | join(',')
          ),
        }
        if (linux_freeipa_enroll_clear_proxy_environment | bool)
        else {}
      }}
  changed_when: false
  no_log: true

- name: Note when Linux IPA enrollment is forcing explicit-server join behavior
  ansible.builtin.debug:
    msg: >-
      Linux IPA enrollment is forcing deterministic explicit-server behavior for {{ inventory_hostname }}.
      The role will disable DNS-based IPA server discovery because explicit server candidates are configured:
      {{ linux_freeipa_enroll_effective_servers_normalized | join(', ') }}.
  changed_when: false
  when:
    - linux_freeipa_enroll_effective_servers_normalized | length > 0
    - linux_freeipa_enroll_force_no_dns_lookup_with_explicit_servers | bool
    - not (linux_freeipa_enroll_requested_no_dns_lookup | bool)

- name: Validate Linux IPA /etc/hosts bootstrap entries
  vars:
    linux_freeipa_enroll_entry_names: >-
      {{
        (
          item.names
          if (item.names is sequence and item.names is not string)
          else (
            item.names
            | default('', true)
            | string
            | split(',')
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  ansible.builtin.assert:
    that:
      - item.ip | default('', true) | string | trim | length > 0
      - linux_freeipa_enroll_entry_names | length > 0
    fail_msg: >-
      Each linux_ipa_etc_hosts_entries item must define a non-empty ip and at least one hostname under names.
      Invalid entry: {{ item | to_nice_yaml(indent=2) | trim }}
  loop: "{{ linux_freeipa_enroll_effective_etc_hosts_entries }}"
  loop_control:
    label: "{{ item.ip | default('missing-ip') }}"
  when: linux_freeipa_enroll_effective_manage_etc_hosts | bool

- name: Derive Linux IPA server bootstrap /etc/hosts entries from inventory
  vars:
    linux_freeipa_enroll_inventory_ipa_server_entries_yaml: |
      {% set entries = [] %}
      {% for server in linux_freeipa_enroll_effective_servers_normalized %}
      {%   set inventory_hosts = groups['ipa_servers'] | default([]) %}
      {%   if server in inventory_hosts %}
      {%     set candidate_ip = hostvars[server].ansible_host | default('', true) | string | trim %}
      {%     set candidate_short = server | regex_replace('\\..*$', '') %}
      {%     if candidate_ip | length > 0 and ((candidate_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')) or (candidate_ip is match('^[0-9A-Fa-f:]+$'))) %}
      {%       set names = [server] %}
      {%       if candidate_short | length > 0 and candidate_short != server %}
      {%         set _ = names.append(candidate_short) %}
      {%       endif %}
      {%       set _ = entries.append({
             'ip': candidate_ip,
             'names': names | unique | list
           }) %}
      {%     endif %}
      {%   endif %}
      {% endfor %}
      {{ entries | to_yaml }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_inventory_ipa_server_bootstrap_entries: "{{ linux_freeipa_enroll_inventory_ipa_server_entries_yaml | from_yaml }}"
  changed_when: false
  when: linux_freeipa_enroll_bootstrap_ipa_server_hosts_from_inventory | bool

- name: Combine Linux IPA /etc/hosts bootstrap entries
  ansible.builtin.set_fact:
    linux_freeipa_enroll_manual_etc_hosts_entries: >-
      {{
        (
          linux_freeipa_enroll_effective_etc_hosts_entries
          if (linux_freeipa_enroll_effective_manage_etc_hosts | bool)
          else []
        )
      }}
    linux_freeipa_enroll_combined_etc_hosts_entries: >-
      {{
        (
          (
            linux_freeipa_enroll_effective_etc_hosts_entries
            if (linux_freeipa_enroll_effective_manage_etc_hosts | bool)
            else []
          )
          +
          (
            linux_freeipa_enroll_inventory_ipa_server_bootstrap_entries
            | default([])
          )
        )
      }}
  changed_when: false

- name: Build Linux IPA /etc/hosts bootstrap lines
  vars:
    linux_freeipa_enroll_etc_hosts_lines_yaml: |
      {% set lines = [] %}
      {% for entry in linux_freeipa_enroll_combined_etc_hosts_entries | default([]) %}
      {%   set entry_names = (
             entry.names
             if (entry.names is sequence and entry.names is not string)
             else (
               entry.names
               | default('', true)
               | string
               | split(',')
             )
           )
           | map('string')
           | map('trim')
           | reject('equalto', '')
           | list %}
      {%   if (entry.ip | default('', true) | string | trim | length > 0) and (entry_names | length > 0) %}
      {%     set _ = lines.append((entry.ip | string | trim) ~ ' ' ~ (entry_names | join(' '))) %}
      {%   endif %}
      {% endfor %}
      {{ lines | to_yaml }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_etc_hosts_lines: "{{ linux_freeipa_enroll_etc_hosts_lines_yaml | from_yaml }}"
  changed_when: false
  when: linux_freeipa_enroll_combined_etc_hosts_entries | default([]) | length > 0

- name: Ensure Linux IPA /etc/hosts bootstrap entries are present
  ansible.builtin.blockinfile:
    path: /etc/hosts
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: FreeIPA bootstrap entries"
    block: |
      {% for line in linux_freeipa_enroll_etc_hosts_lines %}
      {{ line }}
      {% endfor %}
  when:
    - linux_freeipa_enroll_etc_hosts_lines | default([]) | length > 0

- name: Assert Linux IPA domain is not configured as an IPA server hostname
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_effective_domain_normalized not in linux_freeipa_enroll_effective_servers_normalized
    fail_msg: >-
      ipaclient_domain must be the shared IPA DNS domain, not an IPA server hostname.
      For example, use example.com for ipaclient_domain and ipa01.example.com under linux_ipa_servers.
      Current values are ipaclient_domain={{ linux_freeipa_enroll_effective_domain_normalized }} and
      linux_ipa_servers={{ linux_freeipa_enroll_effective_servers_normalized | join(', ') }}.
  when: linux_freeipa_enroll_effective_servers_normalized | length > 0

- name: Resolve configured IPA servers from the Linux guest
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ item }}"
  register: linux_freeipa_enroll_server_resolution
  loop: "{{ linux_freeipa_enroll_effective_servers_normalized }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - linux_freeipa_enroll_effective_servers_normalized | length > 0
    - not (linux_freeipa_enroll_effective_configure_dns_resolver | bool)

- name: Assert configured IPA servers resolve from the Linux guest
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | default('') | trim | length > 0
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot resolve the configured IPA server {{ item.item }}.
      Verify DNS or /etc/hosts on the guest, and verify ipaclient_domain is the shared IPA DNS domain
      rather than a server hostname.
  loop: "{{ linux_freeipa_enroll_server_resolution.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (linux_freeipa_enroll_effective_configure_dns_resolver | bool)

- name: Check LDAP reachability to configured IPA servers from the Linux guest
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 389
    timeout: 5
    connect_timeout: 3
    state: started
  register: linux_freeipa_enroll_ldap_connectivity
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ linux_freeipa_enroll_effective_servers_normalized }}"
  loop_control:
    label: "{{ item }}"

- name: Assert LDAP reachability to configured IPA servers from the Linux guest
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false))
      - item.elapsed is defined
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot reach LDAP on {{ item.item }}:389.
      FreeIPA client discovery needs TCP 389 to the IPA server. Verify firewall, routing, and that
      the configured target is a real IPA server.
  loop: "{{ linux_freeipa_enroll_ldap_connectivity.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check HTTPS reachability to configured IPA servers from the Linux guest
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: "{{ linux_freeipa_enroll_effective_https_port | int }}"
    timeout: 5
    connect_timeout: 3
    state: started
  register: linux_freeipa_enroll_https_connectivity
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ linux_freeipa_enroll_effective_servers_normalized }}"
  loop_control:
    label: "{{ item }}"

- name: Assert HTTPS reachability to configured IPA servers from the Linux guest
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false))
      - item.elapsed is defined
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot reach HTTPS on {{ item.item }}:{{ linux_freeipa_enroll_effective_https_port }}.
      FreeIPA enrollment also needs the IPA web/API endpoint. Verify firewall, routing, and that
      the configured target is a real IPA server.
  loop: "{{ linux_freeipa_enroll_https_connectivity.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Probe the FreeIPA JSON endpoint on configured IPA servers from the Linux guest
  ansible.builtin.uri:
    url: "https://{{ item }}{{ linux_freeipa_enroll_effective_https_port_suffix }}/ipa/json"
    method: GET
    return_content: false
    use_proxy: false
    validate_certs: false
    timeout: "{{ linux_freeipa_enroll_preflight_json_probe_timeout | int }}"
    status_code:
      - 200
      - 401
      - 302
      - 303
  register: linux_freeipa_enroll_json_probe
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ linux_freeipa_enroll_effective_servers_normalized }}"
  loop_control:
    label: "{{ item }}"
  when:
    - linux_freeipa_enroll_preflight_json_probe_enabled | bool
    - linux_freeipa_enroll_effective_servers_normalized | length > 0

- name: Classify FreeIPA JSON preflight probe results for the Linux guest
  vars:
    linux_freeipa_enroll_json_probe_classified_yaml: |
      {% set classified = {'healthy': [], 'failed': []} %}
      {% for result in linux_freeipa_enroll_json_probe.results | default([]) %}
      {%   set ok = (not (result.failed | default(false))) and ((result.status | default(0) | int) in [200, 401, 302, 303]) %}
      {%   if ok %}
      {%     set _ = classified.healthy.append(result.item | default('unknown') | string | trim | lower) %}
      {%   else %}
      {%     set _ = classified.failed.append({
             'server': result.item | default('unknown') | string | trim | lower,
             'status': result.status | default('unknown'),
             'elapsed': result.elapsed | default('unknown'),
             'msg': result.msg | default('unknown probe failure') | string | trim
           }) %}
      {%   endif %}
      {% endfor %}
      {{ classified | to_yaml }}
  ansible.builtin.set_fact:
    linux_freeipa_enroll_json_probe_classified: "{{ linux_freeipa_enroll_json_probe_classified_yaml | from_yaml }}"
  changed_when: false
  when: linux_freeipa_enroll_preflight_json_probe_enabled | bool

- name: Summarize FreeIPA JSON preflight probe behavior for the Linux guest
  ansible.builtin.set_fact:
    linux_freeipa_enroll_json_probe_healthy_candidates: >-
      {{
        linux_freeipa_enroll_json_probe_classified.healthy
        | default([])
        | list
      }}
    linux_freeipa_enroll_json_probe_failed_results: >-
      {{
        linux_freeipa_enroll_json_probe_classified.failed
        | default([])
        | list
      }}
    linux_freeipa_enroll_json_probe_all_failed: >-
      {{
        (
          linux_freeipa_enroll_effective_servers_normalized | length > 0
        )
        and
        (
          linux_freeipa_enroll_json_probe_classified.healthy
          | default([])
          | length
        ) == 0
      }}
    linux_freeipa_enroll_json_probe_failure_summary: >-
      {%- set failures = [] -%}
      {%- for result in linux_freeipa_enroll_json_probe_classified.failed | default([]) -%}
      {%-   set _ = failures.append(
             (result.server | default('unknown'))
             ~ ' status=' ~ (result.status | string)
             ~ ' elapsed=' ~ (result.elapsed | string) ~ 's'
             ~ ' msg=' ~ (result.msg | default('unknown probe failure') | regex_replace('\\s+', ' '))
           ) -%}
      {%- endfor -%}
      {{ failures | join(' ; ') }}
  changed_when: false
  when: linux_freeipa_enroll_preflight_json_probe_enabled | bool

- name: Note when Linux IPA enrollment is excluding unhealthy IPA API candidates
  ansible.builtin.debug:
    msg: >-
      Linux IPA enrollment is excluding these IPA server candidates for {{ inventory_hostname }}
      because their FreeIPA JSON preflight probe did not return promptly:
      {{ linux_freeipa_enroll_json_probe_failed_results | map(attribute='server') | list | join(', ') }}.
      The join will continue with the responsive candidates:
      {{ linux_freeipa_enroll_json_probe_healthy_candidates | join(', ') }}.
  changed_when: false
  when:
    - linux_freeipa_enroll_preflight_json_probe_enabled | bool
    - linux_freeipa_enroll_json_probe_failed_results | default([]) | length > 0
    - linux_freeipa_enroll_json_probe_healthy_candidates | default([]) | length > 0

- name: Fail when every FreeIPA JSON preflight probe is unhealthy and timeout continuation is disabled
  ansible.builtin.fail:
    msg: >-
      Linux guest {{ inventory_hostname }} reached the configured IPA servers on TCP {{ linux_freeipa_enroll_effective_https_port }}, but every FreeIPA JSON
      preflight probe timed out or failed within {{ linux_freeipa_enroll_preflight_json_probe_timeout | int }} seconds.
      Summary: {{ linux_freeipa_enroll_json_probe_failure_summary | default('unknown probe failure') }}.
      This usually indicates a proxy, TLS, web-tier, or IPA API responsiveness problem rather than a basic
      network reachability issue.
  when:
    - linux_freeipa_enroll_preflight_json_probe_enabled | bool
    - linux_freeipa_enroll_json_probe_all_failed | default(false) | bool
    - not (linux_freeipa_enroll_continue_on_join_timeout | bool)

- name: Note when every FreeIPA JSON preflight probe is unhealthy and timeout continuation is enabled
  ansible.builtin.debug:
    msg: >-
      Linux guest {{ inventory_hostname }} reached the configured IPA servers on TCP {{ linux_freeipa_enroll_effective_https_port }}, but every FreeIPA JSON
      preflight probe timed out or failed within {{ linux_freeipa_enroll_preflight_json_probe_timeout | int }} seconds.
      Summary: {{ linux_freeipa_enroll_json_probe_failure_summary | default('unknown probe failure') }}.
      The repository will skip the expensive upstream join retries and mark this host as timed out immediately.
  changed_when: false
  when:
    - linux_freeipa_enroll_preflight_json_probe_enabled | bool
    - linux_freeipa_enroll_json_probe_all_failed | default(false) | bool
    - linux_freeipa_enroll_continue_on_join_timeout | bool

- name: Read current Linux guest FQDN before IPA enrollment
  ansible.builtin.command: hostname -f
  register: linux_freeipa_enroll_current_fqdn
  check_mode: false
  changed_when: false
  failed_when: false

- name: Read current Linux guest short hostname before IPA enrollment
  ansible.builtin.command: hostname -s
  register: linux_freeipa_enroll_current_short_hostname
  check_mode: false
  changed_when: false
  failed_when: false

- name: Prepare Linux guest hostname candidates for IPA enrollment
  ansible.builtin.set_fact:
    linux_freeipa_enroll_target_hostname: >-
      {{
        freeipa_hostgroup_hostname
        | default(linux_ipa_effective_hostname, true)
        | default('', true)
        | string
        | trim
        | lower
      }}
    linux_freeipa_enroll_current_fqdn_normalized: >-
      {{
        linux_freeipa_enroll_current_fqdn.stdout
        | default('', true)
        | string
        | trim
        | lower
      }}
  changed_when: false

- name: Update Linux guest system hostname from the resolved IPA hostname
  ansible.builtin.command:
    argv:
      - hostnamectl
      - set-hostname
      - "{{ linux_freeipa_enroll_target_hostname }}"
  when:
    - linux_freeipa_enroll_manage_hostname | bool
    - not ansible_check_mode
    - linux_freeipa_enroll_target_hostname is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$')
    - not (linux_freeipa_enroll_target_hostname is match('^[0-9.]+$'))
    - linux_freeipa_enroll_current_fqdn_normalized in ['localhost', 'localhost.localdomain', linux_freeipa_enroll_current_short_hostname.stdout | default('', true) | string | trim | lower]
  changed_when: true

- name: Re-read Linux guest FQDN after hostname management
  ansible.builtin.command: hostname -f
  register: linux_freeipa_enroll_current_fqdn
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - linux_freeipa_enroll_manage_hostname | bool
    - not ansible_check_mode

- name: Assert the Linux guest has a valid system hostname for IPA enrollment
  ansible.builtin.assert:
    that:
      - >-
        (
          linux_freeipa_enroll_current_fqdn.stdout | default('') | trim | lower not in ['localhost', 'localhost.localdomain']
          and
          (linux_freeipa_enroll_current_fqdn.stdout | default('') | trim | lower is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$'))
          and
          not ((linux_freeipa_enroll_current_fqdn.stdout | default('') | trim | lower) is match('^[0-9.]+$'))
        )
        or
        (
          ansible_check_mode
          and
          linux_freeipa_enroll_manage_hostname | bool
          and linux_freeipa_enroll_target_hostname is match('^[a-z0-9][a-z0-9.-]*\\.[a-z0-9-]+$')
          and not (linux_freeipa_enroll_target_hostname is match('^[0-9.]+$'))
        )
    fail_msg: >-
      Linux guest {{ inventory_hostname }} cannot be enrolled into FreeIPA because its current system hostname is
      {{ linux_freeipa_enroll_current_fqdn.stdout | default('unset') | trim | default('unset', true) }}.
      {% if linux_freeipa_enroll_target_hostname | length > 0 %}
      The resolved target hostname for this guest is {{ linux_freeipa_enroll_target_hostname }}.
      {% endif %}
      Set a real FQDN on the guest first, or enable linux_freeipa_enroll_manage_hostname and provide a resolvable
      FQDN through ipa_hostname, linux_ipa_identity_hostname_suffix, or the guest's own hostname configuration.

- name: Resolve the Linux guest hostname that will be enrolled
  ansible.builtin.set_fact:
    linux_freeipa_enroll_hostname_to_verify: >-
      {{
        (
          linux_freeipa_enroll_target_hostname
          if (linux_freeipa_enroll_target_hostname | length > 0)
          else (
            linux_freeipa_enroll_current_fqdn.stdout
            | default('', true)
            | string
            | trim
            | lower
          )
        )
      }}
    linux_freeipa_enroll_hostname_short_to_verify: >-
      {{
        (
          (
            linux_freeipa_enroll_target_hostname
            if (linux_freeipa_enroll_target_hostname | length > 0)
            else (
              linux_freeipa_enroll_current_fqdn.stdout
              | default('', true)
              | string
              | trim
              | lower
            )
          )
          | regex_replace('\\..*$', '')
        )
      }}
    linux_freeipa_enroll_primary_ipv4_to_verify: >-
      {{
        ansible_facts.get('default_ipv4', {}).get('address', '')
        | string
        | trim
      }}
  changed_when: false

- name: Repair authoritative DNS for the Linux guest enrollment hostname
  ansible.builtin.include_tasks: authoritative-dns.yml
  when: linux_freeipa_enroll_effective_manage_authoritative_dns | bool

- name: Pin the Linux guest enrollment hostname to the guest primary IPv4 in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: FreeIPA local hostname pin"
    block: |
      {{ linux_freeipa_enroll_primary_ipv4_to_verify }} {{ linux_freeipa_enroll_hostname_to_verify }}{% if linux_freeipa_enroll_hostname_short_to_verify | length > 0 and linux_freeipa_enroll_hostname_short_to_verify != linux_freeipa_enroll_hostname_to_verify %} {{ linux_freeipa_enroll_hostname_short_to_verify }}{% endif %}
  when:
    - linux_freeipa_enroll_pin_local_hostname_in_etc_hosts | bool
    - linux_freeipa_enroll_primary_ipv4_to_verify | length > 0
    - linux_freeipa_enroll_hostname_to_verify | length > 0

- name: Choose the Linux guest hostname resolution lookup mode
  ansible.builtin.set_fact:
    linux_freeipa_enroll_hostname_resolution_database: >-
      {{
        'ahostsv4'
        if (linux_freeipa_enroll_primary_ipv4_to_verify | length > 0)
        else 'hosts'
      }}
  changed_when: false

- name: Resolve the Linux guest enrollment hostname locally on the guest
  ansible.builtin.command:
    argv:
      - getent
      - "{{ linux_freeipa_enroll_hostname_resolution_database }}"
      - "{{ linux_freeipa_enroll_hostname_to_verify }}"
  register: linux_freeipa_enroll_hostname_resolution
  changed_when: false
  failed_when: false
  check_mode: false

- name: Normalize resolved addresses for the Linux guest enrollment hostname
  ansible.builtin.set_fact:
    linux_freeipa_enroll_hostname_resolved_addresses: >-
      {{
        linux_freeipa_enroll_hostname_resolution.stdout_lines
        | default([])
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | map('split')
        | map('first')
        | unique
        | list
      }}
  changed_when: false

- name: Assert the Linux guest enrollment hostname resolves to usable non-link-local addresses
  vars:
    linux_freeipa_enroll_hostname_bad_resolution_pattern: '^(127\\.|::1$|169\\.254\\.|fe[89ab][0-9a-f]:)'
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_hostname_resolution.rc == 0
      - linux_freeipa_enroll_hostname_resolution.stdout | default('') | trim | length > 0
      - linux_freeipa_enroll_hostname_resolved_addresses | length > 0
      - >-
        (
          (linux_freeipa_enroll_primary_ipv4_to_verify | length == 0)
          or
          (
            linux_freeipa_enroll_primary_ipv4_to_verify
            in linux_freeipa_enroll_hostname_resolved_addresses
          )
        )
      - >-
        (
          linux_freeipa_enroll_hostname_resolved_addresses
          | select('match', linux_freeipa_enroll_hostname_bad_resolution_pattern)
          | list
          | length
        ) == 0
    fail_msg: >-
      Linux guest {{ inventory_hostname }} resolves its enrollment hostname {{ linux_freeipa_enroll_hostname_to_verify }}
      through getent {{ linux_freeipa_enroll_hostname_resolution_database }} as
      {{ linux_freeipa_enroll_hostname_resolved_addresses | default([]) | join(', ') | default('an unresolved value', true) }}.
      The guest hostname must resolve to the guest primary IPv4 when available and must not resolve to loopback or
      link-local addresses such as 127.0.0.1, ::1, 169.254.0.0/16, or fe80::/10. Fix DNS or /etc/hosts on the guest
      before IPA enrollment.

- name: Resolve the Linux guest primary IPv4 address back to a hostname
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ linux_freeipa_enroll_primary_ipv4_to_verify }}"
  register: linux_freeipa_enroll_primary_ipv4_reverse_resolution
  changed_when: false
  failed_when: false
  check_mode: false
  when: linux_freeipa_enroll_primary_ipv4_to_verify | length > 0

- name: Normalize reverse DNS names for the Linux guest primary IPv4 address
  ansible.builtin.set_fact:
    linux_freeipa_enroll_primary_ipv4_reverse_names: >-
      {{
        (
          linux_freeipa_enroll_primary_ipv4_reverse_resolution.stdout
          | default('', true)
          | string
          | trim
          | split()
        )[1:]
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | map('lower')
        | list
      }}
  changed_when: false
  when: linux_freeipa_enroll_primary_ipv4_to_verify | length > 0

- name: Note when Linux guest reverse DNS verification is being relaxed
  ansible.builtin.debug:
    msg: >-
      Linux guest {{ inventory_hostname }} has primary IPv4 address {{ linux_freeipa_enroll_primary_ipv4_to_verify }},
      but authoritative PTR repair is unavailable for this address in the current FreeIPA DNS workflow.
      Reverse DNS currently resolves to
      {{ linux_freeipa_enroll_primary_ipv4_reverse_names | default([]) | join(', ') | default('an unresolved value', true) }}.
      The enrollment role will continue with forward hostname validation and the upstream IPA client join.
  changed_when: false
  when:
    - linux_freeipa_enroll_primary_ipv4_to_verify | length > 0
    - linux_freeipa_enroll_effective_manage_authoritative_dns | bool
    - not (linux_freeipa_enroll_authoritative_dns_reverse_zone_available | default(false) | bool)
    - linux_freeipa_enroll_hostname_to_verify not in (linux_freeipa_enroll_primary_ipv4_reverse_names | default([]))

- name: Assert the Linux guest primary IPv4 reverse DNS matches the enrollment hostname
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_primary_ipv4_reverse_resolution.rc == 0
      - linux_freeipa_enroll_primary_ipv4_reverse_resolution.stdout | default('') | trim | length > 0
      - linux_freeipa_enroll_primary_ipv4_reverse_names | length > 0
      - linux_freeipa_enroll_hostname_to_verify in linux_freeipa_enroll_primary_ipv4_reverse_names
    fail_msg: >-
      Linux guest {{ inventory_hostname }} has primary IPv4 address {{ linux_freeipa_enroll_primary_ipv4_to_verify }}
      but reverse DNS resolves it to
      {{ linux_freeipa_enroll_primary_ipv4_reverse_names | default([]) | join(', ') | default('an unresolved value', true) }}
      instead of {{ linux_freeipa_enroll_hostname_to_verify }}.
      Fix the PTR record so the guest primary IP maps back to the same FQDN used for IPA enrollment.
  when:
    - linux_freeipa_enroll_primary_ipv4_to_verify | length > 0
    - not (
        (linux_freeipa_enroll_effective_manage_authoritative_dns | bool)
        and
        not (linux_freeipa_enroll_authoritative_dns_reverse_zone_available | default(false) | bool)
      )

- name: Skip Linux IPA enrollment in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode skips the upstream FreeIPA ipaclient enrollment role in this repository.
      Use validate.yml plus a real linux-clients or site run to verify actual Linux IPA enrollment.
  when: ansible_check_mode
  changed_when: false

- name: Initialize Linux IPA enrollment join state
  ansible.builtin.set_fact:
    linux_freeipa_enroll_join_succeeded: false
    linux_freeipa_enroll_join_timed_out: false
    linux_freeipa_enroll_join_last_error: ""
    linux_freeipa_enroll_join_last_error_is_timeout: false
    linux_freeipa_enroll_join_last_server: ""
    linux_freeipa_enroll_join_timeout_diagnostics_summary: ""
    linux_freeipa_enroll_join_timeout_diagnostics_log_path: ""
    linux_freeipa_enroll_join_server_candidates: >-
      {{
        (
          linux_freeipa_enroll_json_probe_healthy_candidates
          if (
            (linux_freeipa_enroll_preflight_json_probe_enabled | bool)
            and (linux_freeipa_enroll_json_probe_healthy_candidates | default([]) | length > 0)
          )
          else linux_freeipa_enroll_effective_servers_normalized
        )
        if (linux_freeipa_enroll_effective_servers_normalized | length > 0)
        else ['__auto__']
      }}
  when: not ansible_check_mode

- name: Mark Linux IPA enrollment as timed out before upstream join retries when every IPA API preflight probe failed
  ansible.builtin.set_fact:
    linux_freeipa_enroll_join_timed_out: true
    linux_freeipa_enroll_join_last_error: >-
      FreeIPA JSON preflight probes timed out or failed against all configured IPA servers within
      {{ linux_freeipa_enroll_preflight_json_probe_timeout | int }} seconds.
    linux_freeipa_enroll_join_last_error_is_timeout: true
    linux_freeipa_enroll_join_last_server: >-
      {{
        (
          linux_freeipa_enroll_json_probe_failed_results
          | map(attribute='server')
          | list
          | last
        )
        | default('', true)
      }}
    linux_freeipa_enroll_join_timeout_diagnostics_summary: "{{ linux_freeipa_enroll_json_probe_failure_summary | default('', true) }}"
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_continue_on_join_timeout | bool
    - linux_freeipa_enroll_json_probe_all_failed | default(false) | bool

- name: Retry Linux host enrollment into FreeIPA across the effective IPA server candidates
  ansible.builtin.include_tasks: join-attempt.yml
  loop: "{{ range(1, (linux_freeipa_enroll_join_attempts | int) + 1) | product(linux_freeipa_enroll_join_server_candidates) | list }}"
  loop_control:
    loop_var: linux_freeipa_enroll_join_plan_item
    label: >-
      attempt {{ linux_freeipa_enroll_join_plan_item.0 }} ->
      {{
        'auto-discovery'
        if (linux_freeipa_enroll_join_plan_item.1 == '__auto__')
        else linux_freeipa_enroll_join_plan_item.1
      }}
  vars:
    linux_freeipa_enroll_join_attempt: "{{ linux_freeipa_enroll_join_plan_item.0 }}"
    linux_freeipa_enroll_join_candidate_server: "{{ linux_freeipa_enroll_join_plan_item.1 }}"
    linux_freeipa_enroll_join_candidate_is_last_for_attempt: >-
      {{
        (
          linux_freeipa_enroll_join_plan_item.1
          == (linux_freeipa_enroll_join_server_candidates | last)
        ) | bool
      }}
  when:
    - not ansible_check_mode
    - not (linux_freeipa_enroll_join_succeeded | bool)
    - not (linux_freeipa_enroll_join_timed_out | bool)

- name: Note when Linux IPA enrollment timed out and timeout continuation is enabled
  ansible.builtin.debug:
    msg: >-
      Linux IPA enrollment timed out for {{ inventory_hostname }} after
      {{ linux_freeipa_enroll_join_attempts | int }} attempts across
      {{ linux_freeipa_enroll_join_server_candidates | reject('equalto', '__auto__') | list | join(', ') | default('auto-discovery', true) }}.
      The host is being left unenrolled and excluded from the success group so the workflow can continue.
      Last error: {{ linux_freeipa_enroll_join_last_error | default('unknown error') }}
      {% if linux_freeipa_enroll_join_timeout_diagnostics_summary | default('', true) | trim | length > 0 %}
      Diagnostics: {{ linux_freeipa_enroll_join_timeout_diagnostics_summary }}
      {% endif %}
  changed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_continue_on_join_timeout | bool
    - linux_freeipa_enroll_join_timed_out | bool

- name: Assert Linux IPA enrollment completed successfully
  ansible.builtin.assert:
    that:
      - linux_freeipa_enroll_join_succeeded | bool
    fail_msg: >-
      Linux IPA enrollment did not complete successfully for {{ inventory_hostname }}.
      Last server candidate: {{ linux_freeipa_enroll_join_last_server | default('unknown', true) }}.
      Last error: {{ linux_freeipa_enroll_join_last_error | default('unknown error') }}
      {% if linux_freeipa_enroll_join_timeout_diagnostics_summary | default('', true) | trim | length > 0 %}
      Diagnostics: {{ linux_freeipa_enroll_join_timeout_diagnostics_summary }}
      {% endif %}
  when:
    - not ansible_check_mode
    - not (
        (linux_freeipa_enroll_continue_on_join_timeout | bool)
        and
        (linux_freeipa_enroll_join_timed_out | bool)
      )

- name: Prepare Linux guest NetworkManager DNS refresh state
  ansible.builtin.set_fact:
    linux_freeipa_enroll_should_refresh_networkmanager_dns: >-
      {{
        (linux_freeipa_enroll_join_succeeded | bool)
        and (linux_freeipa_enroll_effective_configure_dns_resolver | bool)
        and (linux_freeipa_enroll_effective_dns_servers | default([]) | length > 0)
        and (linux_freeipa_enroll_effective_networkmanager_dns_refresh_strategy in ['apply', 'restart'])
      }}
    linux_freeipa_enroll_networkmanager_dns_refresh_interface: >-
      {{
        ansible_facts.get('default_ipv4', {}).get('interface', '')
        | string
        | trim
      }}
    linux_freeipa_enroll_networkmanager_dns_refresh_performed: false
  changed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_join_succeeded | bool

- name: Gather Linux guest service facts before refreshing DNS on NetworkManager hosts
  ansible.builtin.service_facts:
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_should_refresh_networkmanager_dns | default(false) | bool

- name: Read the active NetworkManager connection profile for targeted DNS refresh
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - GENERAL.CONNECTION
      - device
      - show
      - "{{ linux_freeipa_enroll_networkmanager_dns_refresh_interface }}"
  register: linux_freeipa_enroll_networkmanager_active_connection_name
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_should_refresh_networkmanager_dns | default(false) | bool
    - linux_freeipa_enroll_effective_networkmanager_dns_refresh_strategy == 'apply'
    - ansible_service_mgr == 'systemd'
    - "'NetworkManager.service' in (ansible_facts.services | default({}))"
    - (ansible_facts.services['NetworkManager.service'].state | default('')) == 'running'
    - linux_freeipa_enroll_networkmanager_dns_refresh_interface | length > 0

- name: Apply Linux IPA DNS resolver changes through the active NetworkManager device
  block:
    - name: Reapply the active NetworkManager device configuration
      ansible.builtin.command:
        argv:
          - nmcli
          - device
          - reapply
          - "{{ linux_freeipa_enroll_networkmanager_dns_refresh_interface }}"
      changed_when: true

  rescue:
    - name: Reactivate the active NetworkManager connection after device reapply failure
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - up
          - "{{ linux_freeipa_enroll_networkmanager_active_connection_name.stdout | default('', true) | trim }}"
      changed_when: true
      when: linux_freeipa_enroll_networkmanager_active_connection_name.stdout | default('', true) | trim | length > 0

    - name: Fail when targeted NetworkManager DNS refresh cannot determine an active connection profile
      ansible.builtin.fail:
        msg: >-
          Linux guest {{ inventory_hostname }} could not apply the updated DNS resolver settings through NetworkManager
          because the active connection profile for interface
          {{ linux_freeipa_enroll_networkmanager_dns_refresh_interface | default('unknown', true) }}
          could not be determined.
      when: linux_freeipa_enroll_networkmanager_active_connection_name.stdout | default('', true) | trim | length == 0
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_should_refresh_networkmanager_dns | default(false) | bool
    - linux_freeipa_enroll_effective_networkmanager_dns_refresh_strategy == 'apply'
    - ansible_service_mgr == 'systemd'
    - "'NetworkManager.service' in (ansible_facts.services | default({}))"
    - (ansible_facts.services['NetworkManager.service'].state | default('')) == 'running'
    - linux_freeipa_enroll_networkmanager_dns_refresh_interface | length > 0

- name: Mark targeted NetworkManager DNS refresh as performed
  ansible.builtin.set_fact:
    linux_freeipa_enroll_networkmanager_dns_refresh_performed: true
  changed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_should_refresh_networkmanager_dns | default(false) | bool
    - linux_freeipa_enroll_effective_networkmanager_dns_refresh_strategy == 'apply'
    - ansible_service_mgr == 'systemd'
    - "'NetworkManager.service' in (ansible_facts.services | default({}))"
    - (ansible_facts.services['NetworkManager.service'].state | default('')) == 'running'
    - linux_freeipa_enroll_networkmanager_dns_refresh_interface | length > 0

- name: Restart NetworkManager after Linux IPA DNS resolver changes
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: restarted
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_should_refresh_networkmanager_dns | default(false) | bool
    - linux_freeipa_enroll_effective_networkmanager_dns_refresh_strategy == 'restart'
    - ansible_service_mgr == 'systemd'
    - "'NetworkManager.service' in (ansible_facts.services | default({}))"
    - (ansible_facts.services['NetworkManager.service'].state | default('')) == 'running'

- name: Mark restart-based NetworkManager DNS refresh as performed
  ansible.builtin.set_fact:
    linux_freeipa_enroll_networkmanager_dns_refresh_performed: true
  changed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_should_refresh_networkmanager_dns | default(false) | bool
    - linux_freeipa_enroll_effective_networkmanager_dns_refresh_strategy == 'restart'
    - ansible_service_mgr == 'systemd'
    - "'NetworkManager.service' in (ansible_facts.services | default({}))"
    - (ansible_facts.services['NetworkManager.service'].state | default('')) == 'running'

- name: Reset the Ansible SSH connection after NetworkManager DNS refresh
  meta: reset_connection
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_networkmanager_dns_refresh_performed | default(false) | bool

- name: Wait for the Linux guest to reconnect after NetworkManager DNS refresh
  ansible.builtin.wait_for_connection:
    timeout: 60
    sleep: 2
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_networkmanager_dns_refresh_performed | default(false) | bool

- name: Mark Linux guest as successfully enrolled for later FreeIPA hostgroup updates
  ansible.builtin.add_host:
    name: "{{ inventory_hostname }}"
    groups: "{{ linux_freeipa_enroll_success_group }}"
    freeipa_hostgroup_hostname: "{{ freeipa_hostgroup_hostname | default(omit) }}"
    ipa_hostname: "{{ ipa_hostname | default(omit) }}"
  delegate_to: localhost
  changed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_join_succeeded | bool

- name: Mark Linux guest as timed out during IPA enrollment
  ansible.builtin.add_host:
    name: "{{ inventory_hostname }}"
    groups: "{{ linux_freeipa_enroll_timeout_group }}"
  delegate_to: localhost
  changed_when: false
  when:
    - not ansible_check_mode
    - linux_freeipa_enroll_continue_on_join_timeout | bool
    - linux_freeipa_enroll_join_timed_out | bool
