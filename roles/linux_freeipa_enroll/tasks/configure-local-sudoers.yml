---
- name: Build the effective Linux IPA sudoers group names
  ansible.builtin.set_fact:
    linux_freeipa_enroll_local_sudo_groups_effective: >-
      {{
        (
          linux_freeipa_enroll_local_sudo_groups
          +
          (
            (
              linux_freeipa_enroll_local_sudo_groups
              | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_domain | string | trim | lower))
              | list
            )
            if (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
            else []
          )
          +
          (
            (
              linux_freeipa_enroll_local_sudo_groups
              | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_realm | string | trim | upper))
              | list
            )
            if (
              (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
              and
              (
                (linux_freeipa_enroll_effective_realm | string | trim | upper)
                !=
                (linux_freeipa_enroll_effective_domain | string | trim | lower)
              )
            )
            else []
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}
  changed_when: false

- name: Read direct FreeIPA members for Linux IPA sudo groups
  when: linux_freeipa_enroll_local_sudo_sync_ipa_group_members | bool
  block:
    - name: Create temporary Kerberos cache for Linux IPA sudo group queries
      ansible.builtin.tempfile:
        state: file
        prefix: linux-freeipa-enroll-sudo-krb5cc-
      register: linux_freeipa_enroll_local_sudo_kerberos_cache
      changed_when: false

    - name: Obtain Kerberos ticket for Linux IPA sudo group queries
      ansible.builtin.command:
        argv:
          - kinit
          - -c
          - "{{ linux_freeipa_enroll_local_sudo_kerberos_cache.path }}"
          - "{{ linux_freeipa_enroll_effective_ipaadmin_principal }}"
      args:
        stdin: "{{ linux_freeipa_enroll_effective_ipaadmin_password }}"
        stdin_add_newline: true
      changed_when: false
      no_log: true

    - name: Read FreeIPA membership for Linux IPA sudo groups
      ansible.builtin.command:
        argv:
          - ipa
          - group-show
          - "{{ item }}"
          - --all
          - --raw
      loop: "{{ linux_freeipa_enroll_local_sudo_groups }}"
      loop_control:
        label: "{{ item }}"
      register: linux_freeipa_enroll_local_sudo_group_show
      changed_when: false
      environment:
        KRB5CCNAME: "{{ linux_freeipa_enroll_local_sudo_kerberos_cache.path }}"
        LANG: C
        LC_ALL: C
      no_log: true

    - name: Build the effective Linux IPA sudo usernames
      ansible.builtin.set_fact:
        linux_freeipa_enroll_local_sudo_users_effective: >-
          {{
            (
              (
                linux_freeipa_enroll_local_sudo_group_show.results
                | default([])
                | map(attribute='stdout')
                | map('regex_findall', '(?im)^\\s*member(?:indirect)?[_ ]user\\s*:\\s*(.+?)\\s*$')
                | list
                | flatten
                | map('split', ',')
                | list
                | flatten
              )
              +
              (
                (
                  linux_freeipa_enroll_local_sudo_group_show.results
                  | default([])
                  | map(attribute='stdout')
                  | map('regex_findall', '(?im)^\\s*member(?:indirect)?[_ ]user\\s*:\\s*(.+?)\\s*$')
                  | list
                  | flatten
                  | map('split', ',')
                  | list
                  | flatten
                  | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_domain | string | trim | lower))
                  | list
                )
                if (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
                else []
              )
              +
              (
                (
                  linux_freeipa_enroll_local_sudo_group_show.results
                  | default([])
                  | map(attribute='stdout')
                  | map('regex_findall', '(?im)^\\s*member(?:indirect)?[_ ]user\\s*:\\s*(.+?)\\s*$')
                  | list
                  | flatten
                  | map('split', ',')
                  | list
                  | flatten
                  | map('regex_replace', '$', '@' ~ (linux_freeipa_enroll_effective_realm | string | trim | upper))
                  | list
                )
                if (
                  (linux_freeipa_enroll_local_sudo_group_domain_variants | bool)
                  and
                  (
                    (linux_freeipa_enroll_effective_realm | string | trim | upper)
                    !=
                    (linux_freeipa_enroll_effective_domain | string | trim | lower)
                  )
                )
                else []
              )
            )
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | unique
            | sort
            | list
          }}
      changed_when: false
      no_log: true

  always:
    - name: Destroy temporary Kerberos ticket for Linux IPA sudo group queries
      ansible.builtin.command:
        argv:
          - kdestroy
          - -c
          - "{{ linux_freeipa_enroll_local_sudo_kerberos_cache.path }}"
      changed_when: false
      failed_when: false
      when: linux_freeipa_enroll_local_sudo_kerberos_cache is defined

    - name: Remove temporary Kerberos cache for Linux IPA sudo group queries
      ansible.builtin.file:
        path: "{{ linux_freeipa_enroll_local_sudo_kerberos_cache.path }}"
        state: absent
      changed_when: false
      when: linux_freeipa_enroll_local_sudo_kerberos_cache is defined

- name: Default the effective Linux IPA sudo usernames when IPA member sync is disabled
  ansible.builtin.set_fact:
    linux_freeipa_enroll_local_sudo_users_effective: []
  changed_when: false
  when: not (linux_freeipa_enroll_local_sudo_sync_ipa_group_members | bool)

- name: Ensure the sudoers drop-in directory exists for Linux IPA group sudo access
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    mode: "0755"

- name: Ensure the system sudoers file includes the sudoers drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^(#|@)includedir\s+/etc/sudoers\.d\s*$'
    line: '#includedir /etc/sudoers.d'
    state: present
    validate: /usr/sbin/visudo -cf %s

- name: Configure local sudoers access for Linux IPA admin groups
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-freeipa-linux-admin-groups
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Managed by Ansible: linux_freeipa_enroll
      # Grant sudo on this guest to the configured IPA-backed admin groups.
      {% for group_name in linux_freeipa_enroll_local_sudo_groups_effective %}
      %{{ group_name }} ALL=(ALL:ALL) {% if linux_freeipa_enroll_local_sudo_nopasswd | bool %}NOPASSWD:{% endif %}ALL
      {% endfor %}
      {% for user_name in linux_freeipa_enroll_local_sudo_users_effective | default([]) %}
      {{ user_name }} ALL=(ALL:ALL) {% if linux_freeipa_enroll_local_sudo_nopasswd | bool %}NOPASSWD:{% endif %}ALL
      {% endfor %}
  notify: Refresh Linux IPA sudo access caches

- name: Flush Linux IPA sudo access handlers
  ansible.builtin.meta: flush_handlers
