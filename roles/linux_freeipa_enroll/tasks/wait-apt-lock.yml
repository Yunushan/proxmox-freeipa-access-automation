---
- name: Wait for active APT or DPKG lock holders before refreshing Debian package metadata
  ansible.builtin.shell: |
    set -eu

    timeout_seconds="{{ linux_freeipa_enroll_apt_lock_wait_timeout | default(linux_freeipa_enroll_apt_lock_timeout) | int }}"
    sleep_seconds=5
    elapsed=0
    lock_files="/var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend"

    while true; do
      if command -v fuser >/dev/null 2>&1; then
        if ! fuser $lock_files >/dev/null 2>&1; then
          exit 0
        fi
      elif command -v pgrep >/dev/null 2>&1; then
        if ! pgrep -x apt >/dev/null 2>&1 \
          && ! pgrep -x apt-get >/dev/null 2>&1 \
          && ! pgrep -x dpkg >/dev/null 2>&1 \
          && ! pgrep -x unattended-upgrade >/dev/null 2>&1; then
          exit 0
        fi
      else
        exit 0
      fi

      if [ "$elapsed" -ge "$timeout_seconds" ]; then
        echo "APT or DPKG lock remained busy for ${timeout_seconds}s." >&2
        if command -v fuser >/dev/null 2>&1; then
          fuser -v $lock_files >&2 || true
        elif command -v pgrep >/dev/null 2>&1; then
          pgrep -a -x apt >&2 || true
          pgrep -a -x apt-get >&2 || true
          pgrep -a -x dpkg >&2 || true
          pgrep -a -x unattended-upgrade >&2 || true
        else
          echo "Neither fuser nor pgrep is available to inspect the lock holder." >&2
        fi
        exit 1
      fi

      sleep "$sleep_seconds"
      elapsed=$((elapsed + sleep_seconds))
    done
  args:
    executable: /bin/sh
  changed_when: false
