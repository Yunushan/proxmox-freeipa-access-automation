---
linux_freeipa_enroll_enabled: true
linux_freeipa_enroll_serial: 10
linux_freeipa_enroll_max_fail_percentage: 0
linux_freeipa_enroll_success_group: linux_ipa_clients_enrolled_runtime
linux_freeipa_enroll_timeout_group: linux_ipa_clients_enroll_timeout_runtime
linux_freeipa_enroll_join_attempts: 3
linux_freeipa_enroll_join_retry_delay: 15
linux_freeipa_enroll_continue_on_join_timeout: false
linux_freeipa_enroll_collect_join_timeout_diagnostics: true
linux_freeipa_enroll_refresh_apt_cache: true
linux_freeipa_enroll_wait_for_cloud_init: true
linux_freeipa_enroll_cloud_init_timeout: 60
linux_freeipa_enroll_wait_for_apt_background_services: false
linux_freeipa_enroll_apt_background_services_timeout: 60
linux_freeipa_enroll_apt_lock_timeout: 60
linux_freeipa_enroll_recover_stuck_apt_daily: true
linux_freeipa_enroll_apt_lock_recovery_timeout: 15
linux_freeipa_enroll_join_timeout_diagnostic_http_timeout: 10
linux_freeipa_enroll_join_timeout_diagnostic_ipa_join_timeout: 30
linux_freeipa_enroll_join_timeout_diagnostic_log_dir: /var/tmp
linux_freeipa_enroll_https_port: 443
linux_freeipa_enroll_bootstrap_ipa_server_hosts_from_inventory: true
linux_freeipa_enroll_networkmanager_dns_refresh_strategy: ~
linux_freeipa_enroll_merge_inventory_ipa_servers: true
linux_freeipa_enroll_force_no_dns_lookup_with_explicit_servers: true
linux_freeipa_enroll_clear_proxy_environment: true
linux_freeipa_enroll_preflight_json_probe_enabled: true
linux_freeipa_enroll_preflight_json_probe_timeout: 15
linux_freeipa_enroll_manage_hostname: false
linux_freeipa_enroll_manage_authoritative_dns: false
linux_freeipa_enroll_authoritative_dns_delegate_host: ""
linux_freeipa_enroll_authoritative_dns_query_server: 127.0.0.1
linux_freeipa_enroll_authoritative_dns_remove_link_local_aaaa: true
linux_freeipa_enroll_pin_local_hostname_in_etc_hosts: true
linux_freeipa_enroll_split_dns_enabled: true
linux_freeipa_enroll_split_dns_public_dns_mode: explicit
linux_freeipa_enroll_split_dns_public_dns_servers: []
linux_freeipa_enroll_manage_local_group_sudoers: true
linux_freeipa_enroll_local_sudo_groups:
  - linux-ssh-admins
linux_freeipa_enroll_local_sudo_group_domain_variants: true
linux_freeipa_enroll_local_sudo_sync_ipa_group_members: true
linux_freeipa_enroll_local_sudo_nopasswd: false
linux_freeipa_enroll_sssd_access_update_mode: stable
linux_freeipa_enroll_sssd_fast_memcache_timeout: 30
linux_freeipa_enroll_sssd_fast_entry_cache_timeout: 30
linux_freeipa_enroll_sssd_fast_negative_cache_timeout: 15
linux_freeipa_enroll_sssd_fast_refresh_expired_interval: 15
linux_freeipa_enroll_manage_local_sshd_allow_users: true
linux_freeipa_enroll_local_sshd_allow_users_extra:
  - root
linux_ipa_servers: []
linux_ipaadmin_principal: "{{ freeipa_admin_principal }}"
linux_ipaadmin_password: "{{ freeipa_admin_password }}"
linux_ipaclient_mkhomedir: true
linux_ipaclient_force_join: false
linux_ipaclient_kinit_attempts: 10
linux_ipaclient_no_dns_lookup: true
linux_ipaclient_no_sudo: false
linux_ipasssd_permit: false
linux_ipaclient_configure_dns_resolver: false
linux_ipaclient_dns_servers: []
linux_ipaclient_install_packages: true
linux_ipa_manage_etc_hosts: false
linux_ipa_etc_hosts_entries: []
