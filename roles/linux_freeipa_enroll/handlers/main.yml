---
- name: Reload systemd for Linux split DNS unit changes
  ansible.builtin.command:
    argv:
      - systemctl
      - daemon-reload
  changed_when: false

- name: Restart systemd-resolved for Linux split DNS
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

- name: Check whether sss_cache is available for Linux IPA sudo refresh
  ansible.builtin.command:
    argv:
      - which
      - sss_cache
  register: linux_freeipa_enroll_local_sudoers_sss_cache_binary
  changed_when: false
  failed_when: false
  listen: Refresh Linux IPA sudo access caches

- name: Gather service facts for Linux IPA sudo refresh
  ansible.builtin.service_facts:
  listen: Refresh Linux IPA sudo access caches

- name: Clear SSSD caches after Linux IPA sudoers changes
  ansible.builtin.command:
    argv:
      - sss_cache
      - -E
  changed_when: false
  when: linux_freeipa_enroll_local_sudoers_sss_cache_binary.rc | default(1) == 0
  listen: Refresh Linux IPA sudo access caches

- name: Restart SSSD after Linux IPA sudoers changes
  ansible.builtin.service:
    name: sssd
    state: restarted
  when:
    - "'sssd.service' in (ansible_facts.services | default({})) or 'sssd' in (ansible_facts.services | default({}))"
  listen: Refresh Linux IPA sudo access caches

- name: Gather service facts for Linux SSH access refresh
  ansible.builtin.service_facts:
  listen: Reload SSH daemon for Linux access changes

- name: Reload ssh service after Linux SSH access changes
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when:
    - "'ssh.service' in (ansible_facts.services | default({})) or 'ssh' in (ansible_facts.services | default({}))"
  listen: Reload SSH daemon for Linux access changes

- name: Reload sshd service after Linux SSH access changes
  ansible.builtin.service:
    name: sshd
    state: reloaded
  when:
    - "'sshd.service' in (ansible_facts.services | default({})) or 'sshd' in (ansible_facts.services | default({}))"
  listen: Reload SSH daemon for Linux access changes
