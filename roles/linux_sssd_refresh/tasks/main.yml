---
- name: Check whether sss_cache is available
  ansible.builtin.command: which sss_cache
  register: linux_sssd_refresh_cache_binary
  check_mode: false
  changed_when: false
  failed_when: false

- name: Gather service facts for SSSD refresh
  ansible.builtin.service_facts:

- name: Clear SSSD caches after FreeIPA access changes
  ansible.builtin.command: sss_cache -E
  when: linux_sssd_refresh_cache_binary.rc == 0
  changed_when: false

- name: Restart SSSD after FreeIPA access changes
  ansible.builtin.service:
    name: sssd
    state: restarted
  when:
    - "'sssd.service' in ansible_facts.services or 'sssd' in ansible_facts.services"
