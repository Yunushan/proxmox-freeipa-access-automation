---
linux_ipa_qga_ssh_bootstrap_enabled: false
linux_ipa_qga_ssh_bootstrap_user: ansible-bootstrap
linux_ipa_qga_ssh_bootstrap_shell: /bin/sh
linux_ipa_qga_ssh_bootstrap_public_key_file: "{{ lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519.pub' }}"
linux_ipa_qga_ssh_bootstrap_private_key_file: "{{ linux_ipa_qga_ssh_bootstrap_public_key_file | regex_replace('\\.pub$', '') }}"
linux_ipa_qga_ssh_bootstrap_install_sudo: true
linux_ipa_qga_ssh_bootstrap_timeout: 180
linux_ipa_runtime_group: linux_ipa_clients_runtime
