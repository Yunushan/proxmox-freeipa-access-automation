---
- name: Assert controller-side Linux QGA SSH bootstrap preparation is available
  ansible.builtin.assert:
    that:
      - hostvars['localhost'].linux_ipa_qga_ssh_bootstrap_public_key is defined
      - hostvars['localhost'].linux_ipa_qga_ssh_bootstrap_target_hosts is defined
    fail_msg: >-
      Linux QGA SSH bootstrap controller preparation was not loaded before the
      Proxmox execution phase.

- name: Build the Linux QGA SSH bootstrap target list for the current Proxmox node
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_target_hosts: >-
      {% set ns = namespace(targets=[]) %}
      {% for candidate in hostvars['localhost'].linux_ipa_qga_ssh_bootstrap_target_hosts | default([]) %}
      {%   if (hostvars[candidate].linux_ipa_proxmox_node_inventory_host | default('')) == inventory_hostname %}
      {%     set _ = ns.targets.append(candidate) %}
      {%   endif %}
      {% endfor %}
      {{ ns.targets | to_json }}

- name: Normalize the Linux QGA SSH bootstrap target list for the current Proxmox node
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_target_hosts: "{{ linux_ipa_qga_ssh_bootstrap_target_hosts | from_json }}"

- name: Build the Linux QGA SSH bootstrap qm candidate path list
  vars:
    linux_ipa_qga_ssh_bootstrap_qm_paths: >-
      {{
        (
          [linux_ipa_qga_ssh_bootstrap_qm_path]
          if '/' in linux_ipa_qga_ssh_bootstrap_qm_path
          else []
        )
        +
        linux_ipa_qga_ssh_bootstrap_qm_fallback_paths
      }}
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_qm_candidate_paths: "{{ linux_ipa_qga_ssh_bootstrap_qm_paths | unique }}"
  when: linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0

- name: Probe Linux QGA SSH bootstrap qm candidate paths
  ansible.builtin.stat:
    path: "{{ item }}"
  register: linux_ipa_qga_ssh_bootstrap_qm_path_stats
  loop: "{{ linux_ipa_qga_ssh_bootstrap_qm_candidate_paths }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  when: linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0

- name: Resolve qm from the current Proxmox node PATH
  ansible.builtin.shell: "command -v {{ linux_ipa_qga_ssh_bootstrap_qm_path | quote }}"
  args:
    executable: /bin/sh
  register: linux_ipa_qga_ssh_bootstrap_qm_path_lookup
  changed_when: false
  failed_when: false
  when:
    - linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0
    - "'/' not in linux_ipa_qga_ssh_bootstrap_qm_path"

- name: Set the resolved Linux QGA SSH bootstrap qm path
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_resolved_qm_path: >-
      {{
        (
          linux_ipa_qga_ssh_bootstrap_qm_path_stats.results
          | default([])
          | selectattr('stat.exists')
          | selectattr('stat.executable')
          | map(attribute='item')
          | list
          | first
        )
        | default(
            (
              linux_ipa_qga_ssh_bootstrap_qm_path_lookup
              | default({'stdout': ''})
            ).stdout | trim,
            true
          )
      }}
  when: linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0

- name: Assert a usable qm command exists on the current Proxmox node
  ansible.builtin.assert:
    that:
      - linux_ipa_qga_ssh_bootstrap_resolved_qm_path | default('') | length > 0
    fail_msg: >-
      Could not find a usable qm command on {{ inventory_hostname }}.
      Set linux_ipa_qga_ssh_bootstrap_qm_path to the correct command or absolute path.
  when: linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0

- name: Verify the Proxmox guest agent responds for Linux QGA SSH bootstrap targets
  vars:
    ansible_python_interpreter: "{{ linux_ipa_qga_ssh_bootstrap_delegate_python_interpreter }}"
  ansible.builtin.command:
    argv:
      - "{{ linux_ipa_qga_ssh_bootstrap_resolved_qm_path }}"
      - guest
      - cmd
      - "{{ hostvars[item].linux_ipa_proxmox_vmid | string }}"
      - ping
  become: true
  register: linux_ipa_qga_ssh_bootstrap_ping_results
  loop: "{{ linux_ipa_qga_ssh_bootstrap_target_hosts }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false
  when: linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0

- name: Initialize Linux QGA SSH bootstrap ping result buckets
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_ping_ready_results: []
    linux_ipa_qga_ssh_bootstrap_ping_unavailable_results: []
    linux_ipa_qga_ssh_bootstrap_ready_hosts: []
  when: linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0

- name: Classify Linux QGA SSH bootstrap reachable guest-agent targets
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_ping_ready_results: "{{ linux_ipa_qga_ssh_bootstrap_ping_ready_results + [item] }}"
  loop: "{{ linux_ipa_qga_ssh_bootstrap_ping_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0
    - item.rc | default(1) | int == 0

- name: Classify Linux QGA SSH bootstrap unavailable guest-agent targets
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_ping_unavailable_results: "{{ linux_ipa_qga_ssh_bootstrap_ping_unavailable_results + [item] }}"
  loop: "{{ linux_ipa_qga_ssh_bootstrap_ping_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0
    - item.rc | default(1) | int != 0

- name: Warn when Linux QGA SSH bootstrap skips guests without a responding guest agent
  ansible.builtin.debug:
    msg: >-
      Skipping Linux QGA SSH bootstrap for {{ item.item }} on {{ inventory_hostname }}
      because the Proxmox guest agent did not respond yet
      (stderr={{ item.stderr | default('no stderr') | trim | default('no stderr', true) }}).
      Later plays can still manage this guest if a direct SSH path exists.
  loop: "{{ linux_ipa_qga_ssh_bootstrap_ping_unavailable_results }}"
  loop_control:
    label: "{{ item.item }}"
  when: linux_ipa_qga_ssh_bootstrap_ping_unavailable_results | length > 0

- name: Record Linux QGA SSH bootstrap ping-unavailable status on skipped guests
  ansible.builtin.add_host:
    name: "{{ item.item }}"
    groups: "{{ linux_ipa_runtime_group }}"
    linux_ipa_management_path_bootstrap_status: qga-ping-unavailable
    linux_ipa_management_path_bootstrap_detail: >-
      {{
        item.stderr
        | default(item.stdout, true)
        | default('QEMU guest agent did not respond', true)
        | string
        | trim
      }}
  delegate_to: localhost
  loop: "{{ linux_ipa_qga_ssh_bootstrap_ping_unavailable_results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: linux_ipa_qga_ssh_bootstrap_ping_unavailable_results | length > 0

- name: Build the Linux QGA SSH bootstrap ready host list
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_ready_hosts: "{{ linux_ipa_qga_ssh_bootstrap_ping_ready_results | map(attribute='item') | list }}"
  when: linux_ipa_qga_ssh_bootstrap_target_hosts | length > 0

- name: Ensure Linux QGA SSH bootstrap user and key access exist inside Proxmox-backed guests
  vars:
    ansible_python_interpreter: "{{ linux_ipa_qga_ssh_bootstrap_delegate_python_interpreter }}"
    linux_ipa_qga_ssh_bootstrap_public_key_b64: "{{ hostvars['localhost'].linux_ipa_qga_ssh_bootstrap_public_key | b64encode }}"
    linux_ipa_qga_ssh_bootstrap_guest_script: |
      set -eu
      bootstrap_user='{{ linux_ipa_qga_ssh_bootstrap_user }}'
      bootstrap_shell='{{ linux_ipa_qga_ssh_bootstrap_shell }}'
      bootstrap_pubkey="$(printf '%s' '{{ linux_ipa_qga_ssh_bootstrap_public_key_b64 }}' | base64 -d)"
      bootstrap_sudoers_file="/etc/sudoers.d/zz-{{ linux_ipa_qga_ssh_bootstrap_user }}"

      if [ "$bootstrap_user" = 'root' ]; then
        bootstrap_home='/root'
        bootstrap_group="$(id -gn root)"
      else
        if ! id -u "$bootstrap_user" >/dev/null 2>&1; then
          useradd -m -s "$bootstrap_shell" "$bootstrap_user"
        fi

        if ! command -v sudo >/dev/null 2>&1; then
        {% if linux_ipa_qga_ssh_bootstrap_install_sudo | bool %}
          if command -v dnf >/dev/null 2>&1; then
            dnf -y install sudo
          elif command -v yum >/dev/null 2>&1; then
            yum -y install sudo
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y sudo
          else
            echo "sudo is not installed and no supported package manager was found" >&2
            exit 1
          fi
        {% else %}
          echo "sudo is not installed and linux_ipa_qga_ssh_bootstrap_install_sudo is false" >&2
          exit 1
        {% endif %}
        fi

        bootstrap_home="$(getent passwd "$bootstrap_user" | cut -d: -f6)"
        bootstrap_group="$(id -gn "$bootstrap_user")"
      fi

      install -d -m 0700 -o "$bootstrap_user" -g "$bootstrap_group" "$bootstrap_home/.ssh"
      touch "$bootstrap_home/.ssh/authorized_keys"
      chown "$bootstrap_user:$bootstrap_group" "$bootstrap_home/.ssh/authorized_keys"
      chmod 0600 "$bootstrap_home/.ssh/authorized_keys"
      grep -qxF "$bootstrap_pubkey" "$bootstrap_home/.ssh/authorized_keys" || printf '%s\n' "$bootstrap_pubkey" >> "$bootstrap_home/.ssh/authorized_keys"

      if [ "$bootstrap_user" != 'root' ]; then
        install -d -m 0750 /etc/sudoers.d
        printf '%s\n' '{{ linux_ipa_qga_ssh_bootstrap_user }} ALL=(ALL) NOPASSWD:ALL' > "$bootstrap_sudoers_file"
        chmod 0440 "$bootstrap_sudoers_file"
        visudo -cf "$bootstrap_sudoers_file" >/dev/null

        if ! su -s '{{ linux_ipa_qga_ssh_bootstrap_exec_shell }}' -c 'sudo -n true' "$bootstrap_user"; then
          echo "passwordless sudo verification failed for $bootstrap_user" >&2
          exit 1
        fi
      fi
  ansible.builtin.command:
    argv:
      - "{{ linux_ipa_qga_ssh_bootstrap_resolved_qm_path }}"
      - guest
      - exec
      - "{{ hostvars[item].linux_ipa_proxmox_vmid | string }}"
      - --timeout
      - "{{ linux_ipa_qga_ssh_bootstrap_timeout | int | string }}"
      - --
      - "{{ linux_ipa_qga_ssh_bootstrap_exec_shell }}"
      - -lc
      - "{{ linux_ipa_qga_ssh_bootstrap_guest_script }}"
  become: true
  register: linux_ipa_qga_ssh_bootstrap_exec_results
  loop: "{{ linux_ipa_qga_ssh_bootstrap_ready_hosts }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false
  when: linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0

- name: Initialize Linux QGA SSH bootstrap execution result buckets
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_exec_blocked_results: []
    linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results: []
    linux_ipa_qga_ssh_bootstrap_exec_failed_results: []
    linux_ipa_qga_ssh_bootstrap_exec_success_results: []
    linux_ipa_qga_ssh_bootstrap_bootstrapped_hosts: []
  when: linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0

- name: Classify Linux QGA SSH bootstrap guest-exec policy blocks
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_exec_blocked_results: "{{ linux_ipa_qga_ssh_bootstrap_exec_blocked_results + [item] }}"
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0
    - item.rc | int != 0
    - >-
      'guest-exec' in ((item.stderr | default('') | string | lower))
    - >-
      'disabled' in ((item.stderr | default('') | string | lower))

- name: Classify Linux QGA SSH bootstrap guest-exec shell-missing incompatibilities
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results: "{{ linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results + [item] }}"
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0
    - item.rc | int != 0
    - >-
      'failed to execute child process' in ((item.stderr | default('') | string | lower))
    - >-
      'no such file or directory' in ((item.stderr | default('') | string | lower))

- name: Classify Linux QGA SSH bootstrap unexpected execution failures
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_exec_failed_results: "{{ linux_ipa_qga_ssh_bootstrap_exec_failed_results + [item] }}"
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0
    - item.rc | int != 0
    - >-
      not (
        ('guest-exec' in ((item.stderr | default('') | string | lower)))
        and
        ('disabled' in ((item.stderr | default('') | string | lower)))
      )
    - >-
      not (
        ('failed to execute child process' in ((item.stderr | default('') | string | lower)))
        and
        ('no such file or directory' in ((item.stderr | default('') | string | lower)))
      )

- name: Collect Linux QGA SSH bootstrap successful execution results
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_exec_success_results: "{{ linux_ipa_qga_ssh_bootstrap_exec_success_results + [item] }}"
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0
    - item.rc | int == 0

- name: Warn when Linux QGA SSH bootstrap guest-exec is disabled in the guest agent
  ansible.builtin.debug:
    msg: >-
      Skipping Linux QGA SSH bootstrap for {{ item.item }} on {{ inventory_hostname }}
      because the guest agent rejected guest-exec as not allowed. Later plays must
      rely on an existing SSH path for this guest, or you should enable
      linux_ipa_ssh_bootstrap_enabled with first-touch credentials, or allow
      guest-exec inside qemu-ga.
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_blocked_results }}"
  loop_control:
    label: "{{ item.item }}"
  when: linux_ipa_qga_ssh_bootstrap_exec_blocked_results | length > 0

- name: Record Linux QGA SSH bootstrap guest-exec-blocked status on skipped guests
  ansible.builtin.add_host:
    name: "{{ item.item }}"
    groups: "{{ linux_ipa_runtime_group }}"
    linux_ipa_management_path_bootstrap_status: qga-exec-blocked
    linux_ipa_management_path_bootstrap_detail: >-
      {{
        item.stderr
        | default(item.stdout, true)
        | default('QEMU guest agent rejected guest-exec', true)
        | string
        | trim
      }}
  delegate_to: localhost
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_blocked_results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: linux_ipa_qga_ssh_bootstrap_exec_blocked_results | length > 0

- name: Fail when Linux QGA SSH bootstrap guest-exec is blocked and strict mode is enabled
  ansible.builtin.assert:
    that:
      - not linux_ipa_qga_ssh_bootstrap_fail_on_guest_exec_blocked | bool
    fail_msg: >-
      Linux QGA SSH bootstrap could not run guest-exec for
      {{ linux_ipa_qga_ssh_bootstrap_exec_blocked_results | map(attribute='item') | join(', ') }}
      on {{ inventory_hostname }} because the guest agent rejected the command as
      not allowed. Allow guest-exec inside qemu-ga, or disable strict handling
      with linux_ipa_qga_ssh_bootstrap_fail_on_guest_exec_blocked: false.
  when: linux_ipa_qga_ssh_bootstrap_exec_blocked_results | length > 0

- name: Warn when Linux QGA SSH bootstrap cannot launch the configured guest shell
  ansible.builtin.debug:
    msg: >-
      Skipping Linux QGA SSH bootstrap for {{ item.item }} on {{ inventory_hostname }}
      because the guest agent could not launch {{ linux_ipa_qga_ssh_bootstrap_exec_shell }} inside the guest.
      This usually means the guest is not a normal Linux target for this bootstrap path,
      or the shell path is different. Later plays must rely on an existing SSH path for
      this guest, or you can override linux_ipa_qga_ssh_bootstrap_exec_shell.
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results }}"
  loop_control:
    label: "{{ item.item }}"
  when: linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results | length > 0

- name: Record Linux QGA SSH bootstrap exec-shell-missing status on skipped guests
  ansible.builtin.add_host:
    name: "{{ item.item }}"
    groups: "{{ linux_ipa_runtime_group }}"
    linux_ipa_management_path_bootstrap_status: qga-exec-shell-missing
    linux_ipa_management_path_bootstrap_detail: >-
      {{
        (
          'Configured guest exec shell ' ~ linux_ipa_qga_ssh_bootstrap_exec_shell
          ~ ' could not be launched. '
          ~ (
            item.stderr
            | default(item.stdout, true)
            | default('QEMU guest agent could not launch the configured guest shell', true)
            | string
            | trim
          )
        )
      }}
  delegate_to: localhost
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results | length > 0

- name: Fail when Linux QGA SSH bootstrap cannot launch the configured guest shell and strict mode is enabled
  ansible.builtin.assert:
    that:
      - not linux_ipa_qga_ssh_bootstrap_fail_on_exec_shell_missing | bool
    fail_msg: >-
      Linux QGA SSH bootstrap could not launch {{ linux_ipa_qga_ssh_bootstrap_exec_shell }}
      for {{ linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results | map(attribute='item') | join(', ') }}
      on {{ inventory_hostname }}. Override linux_ipa_qga_ssh_bootstrap_exec_shell
      or disable strict handling with linux_ipa_qga_ssh_bootstrap_fail_on_exec_shell_missing: false.
  when: linux_ipa_qga_ssh_bootstrap_exec_shell_missing_results | length > 0

- name: Fail when Linux QGA SSH bootstrap hit unexpected Proxmox guest exec errors
  vars:
    linux_ipa_qga_ssh_bootstrap_exec_failed_results_summary_template: |
      {%- set summary = [] -%}
      {%- for result in linux_ipa_qga_ssh_bootstrap_exec_failed_results -%}
      {%- set _ = summary.append(
        result.item ~ ' (rc=' ~ (result.rc | string) ~ ', stderr=' ~ ((result.stderr | default('') | trim) | default('no stderr', true)) ~ ')'
      ) -%}
      {%- endfor -%}
      {{ summary | join('; ') }}
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_exec_failed_results_summary: >-
      {{ linux_ipa_qga_ssh_bootstrap_exec_failed_results_summary_template | trim }}
  changed_when: false
  when: linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0

- name: Record Linux QGA SSH bootstrap unexpected execution failures on skipped guests
  ansible.builtin.add_host:
    name: "{{ item.item }}"
    groups: "{{ linux_ipa_runtime_group }}"
    linux_ipa_management_path_bootstrap_status: qga-exec-failed
    linux_ipa_management_path_bootstrap_detail: >-
      {{
        (
          'rc=' ~ (item.rc | string) ~ ', stderr=' ~
          (
            item.stderr
            | default(item.stdout, true)
            | default('unexpected QGA execution failure', true)
            | string
            | trim
          )
        )
      }}
  delegate_to: localhost
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_failed_results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: linux_ipa_qga_ssh_bootstrap_exec_failed_results | length > 0

- name: Fail when Linux QGA SSH bootstrap hit unexpected Proxmox guest exec errors
  ansible.builtin.assert:
    that:
      - linux_ipa_qga_ssh_bootstrap_exec_failed_results | length == 0
    fail_msg: >-
      Linux QGA SSH bootstrap failed on {{ inventory_hostname }} for
      {{ linux_ipa_qga_ssh_bootstrap_exec_failed_results_summary }}.
  when: linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0

- name: Assert Linux QGA SSH bootstrap guest commands completed successfully
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | default('') | trim | length > 0
      - ((item.stdout | from_json).exited | default(0) | int) != 0
      - ((item.stdout | from_json).exitcode | default(1) | int) == 0
    fail_msg: >-
      Linux QGA SSH bootstrap failed for {{ item.item }}.
      Proxmox returned {{ item.stdout | default('no output') | trim | default('no output', true) }}.
  loop: "{{ linux_ipa_qga_ssh_bootstrap_exec_success_results }}"
  loop_control:
    label: "{{ item.item }}"
  when: linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0

- name: Build the Linux QGA SSH bootstrap success host list
  ansible.builtin.set_fact:
    linux_ipa_qga_ssh_bootstrap_bootstrapped_hosts: "{{ linux_ipa_qga_ssh_bootstrap_exec_success_results | map(attribute='item') | list }}"
  when: linux_ipa_qga_ssh_bootstrap_ready_hosts | length > 0

- name: Prefer the Linux QGA SSH bootstrap user for subsequent runtime guest connections
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: "{{ linux_ipa_runtime_group }}"
    ansible_user: "{{ linux_ipa_qga_ssh_bootstrap_user }}"
    ansible_become: "{{ false if linux_ipa_qga_ssh_bootstrap_user == 'root' else true }}"
    ansible_become_method: "{{ omit if linux_ipa_qga_ssh_bootstrap_user == 'root' else 'sudo' }}"
    ansible_ssh_private_key_file: "{{ linux_ipa_qga_ssh_bootstrap_private_key_file }}"
    linux_ipa_management_path_bootstrap_status: qga-bootstrap-ok
    linux_ipa_management_path_bootstrap_detail: >-
      SSH access was bootstrapped through the Proxmox guest agent as
      {{ linux_ipa_qga_ssh_bootstrap_user }} using the configured controller key{{
        ', without sudo escalation because the bootstrap user is root'
        if (linux_ipa_qga_ssh_bootstrap_user == 'root')
        else ', with passwordless sudo prepared for later automation'
      }}.
    linux_freeipa_enroll_split_dns_public_dns_mode: >-
      {{
        hostvars[item].linux_freeipa_enroll_split_dns_public_dns_mode
        | default(hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_mode, true)
        | default(omit)
      }}
    linux_freeipa_enroll_split_dns_public_dns_servers: >-
      {{
        hostvars[item].linux_freeipa_enroll_split_dns_public_dns_servers
        | default(hostvars['localhost'].linux_ipa_runtime_split_dns_public_dns_servers, true)
        | default(omit)
      }}
  delegate_to: localhost
  loop: "{{ linux_ipa_qga_ssh_bootstrap_bootstrapped_hosts }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  when: linux_ipa_qga_ssh_bootstrap_bootstrapped_hosts | length > 0
