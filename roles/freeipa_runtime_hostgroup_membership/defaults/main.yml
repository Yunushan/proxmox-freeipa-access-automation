---
freeipa_runtime_hostgroup_membership_enabled: true
freeipa_runtime_hostgroup_membership_inventory_group: linux_ipa_clients_runtime
freeipa_runtime_hostgroup_membership_hostgroup_inventory_groups:
  - "{{ freeipa_runtime_hostgroup_membership_inventory_group }}"
freeipa_runtime_hostgroup_membership_admin_principal: "{{ freeipa_admin_principal | default('admin') }}"
freeipa_runtime_hostgroup_membership_admin_password: "{{ freeipa_admin_password | default('') }}"
freeipa_runtime_hostgroup_membership_api_context: "{{ freeipa_api_context | default('server') }}"
freeipa_runtime_hostgroup_membership_hostgroups: "{{ freeipa_hostgroups | default([]) }}"
freeipa_runtime_hostgroup_membership_require_targets: false
